  /** Horários ocupados por conta (próximos 120 dias), para não empilhar publicações. */
  async function loadBusy(id) {
    if (S.busy[id]) return;
    S.busy[id] = "loading";
    const qs = new URLSearchParams({ accountId: id, from: new Date().toISOString(), to: new Date(Date.now() + 120 * 864e5).toISOString(), status: "scheduled,queued,processing,paused", limit: "500" });
    try { S.busy[id] = (await api(`/targets?${qs}`)).items.map((t) => +new Date(t.scheduledAt)); } catch { S.busy[id] = []; }
    render();
  }
  /** Próximos N horários livres de uma conta, a partir da data de início, nos dias e horários escolhidos. */
  function freeSlots(id, n) {
    const times = parseTimes(), out = [], taken = S.skipBusy && Array.isArray(S.busy[id]) ? S.busy[id] : [];
    if (!times.length || !S.days.length || !n) return out;
    const today = dayKey(new Date()), [y, m, d] = (S.start > today ? S.start : today).split("-").map(Number), minTs = Date.now() + 2 * 6e4;
    for (let k = 0; k < 400 && out.length < n; k++) {
      const day = new Date(y, m - 1, d + k), wd = ((day.getDay() + 6) % 7) + 1;
      if (!S.days.includes(wd)) continue;
      for (const t of times) {
        const [hh, mm] = t.split(":").map(Number), at = new Date(y, m - 1, d + k, hh, mm);
        if (+at < minTs || taken.some((b) => Math.abs(b - at) < GAP_MS)) continue;
        out.push(at); if (out.length >= n) break;
      }
    }
    return out;
  }
  const plan = () => {
    const ready = S.items.filter((it) => it.mediaId);
    const per = Object.fromEntries(S.sel.map((id) => [id, freeSlots(id, ready.length)]));
    return { ready, per };
  };

  function render() {
    if (S.done) return renderDone();
    const { ready, per } = plan(), times = parseTimes();
    const uploading = S.items.some((it) => !it.mediaId && !it.error);
    const short = S.sel.filter((id) => per[id].length < ready.length);
    const loadingBusy = S.sel.some((id) => S.busy[id] === "loading");
    const missing = [
      !S.sel.length ? "Escolha pelo menos uma conta" : "",
      !S.items.length ? "Envie as mídias ou adicione da biblioteca" : "",
      uploading ? "Aguarde os envios terminarem" : "",
      !times.length ? "Informe pelo menos um horário válido (HH:MM)" : "",
      !S.days.length ? "Escolha pelo menos um dia da semana" : "",
      short.length ? "Não há horários livres suficientes: adicione horários ou dias" : "",
      loadingBusy ? "Conferindo horários ocupados…" : "",
      ...validatePerAccount(ready).slice(0, 2),
    ].filter(Boolean);
    const can = ready.length && !missing.length && !S.sending;
    const step = (n, t, b) => `<section class="panel pad"><h2 class="step"><span class="tnum">${n}</span>${t}</h2>${b}</section>`;
    const accName = (id) => accounts.find((a) => a.id === id)?.username;

    el.innerHTML = head("Agendamento em massa", "Envie várias fotos ou vídeos de uma vez, ou use o que está guardado na biblioteca. Cada item vira uma publicação, colocada nos próximos horários livres de cada conta.") + `<div class="stack">
      ${step(1, "Contas", accounts.length ? `<div class="row" style="flex-wrap:wrap;gap:8px">${accounts.map((a) => `<button class="chip ${S.sel.includes(a.id) ? "on" : ""}" data-acc="${esc(a.id)}" aria-pressed="${S.sel.includes(a.id)}">${avatar(a.profilePictureUrl, a.username, 26)}@${esc(a.username)}</button>`).join("")}</div><p class="hint">Com várias contas, cada foto vai para todas elas, cada uma no próximo horário livre dela.</p>` : `<p class="small muted">Nenhuma conta ativa. <a href="#/accounts">Conecte uma conta</a>.</p>`)}
      ${step(2, "Formato", `<div class="row" style="gap:8px" role="radiogroup">${[["image", "Imagem no feed"], ["reel", "Reel"], ["story", "Story"]].map(([v, l]) => `<button class="opt ${S.type === v ? "on" : ""}" role="radio" aria-checked="${S.type === v}" data-type="${v}" ${S.items.length ? 'disabled title="Remova as fotos para trocar o formato"' : ""}>${l}</button>`).join("")}</div><p class="hint" style="margin-top:8px">${S.type === "image" ? "Fotos fora da proporção do feed (4:5 a 1,91:1) são recortadas no centro." : S.type === "reel" ? "Vídeos MP4 ou MOV de 3 s a 15 min, até 50 MB cada. Proporção 9:16 recomendada." : "Fotos ou vídeos de até 60 s. Story não usa legenda pela API."} Metadados são removidos de tudo antes do envio.</p>`)}
      ${step(3, `${S.type === "reel" ? "Vídeos" : S.type === "story" ? "Fotos e vídeos" : "Fotos"} <span class="small muted tnum" style="font-weight:400">${S.items.length}/${BULK_MAX}</span>`, `
        <label class="drop" id="bdrop" style="width:100%;aspect-ratio:auto;padding:28px 16px"><span>Arraste ${S.type === "reel" ? "os vídeos" : S.type === "story" ? "fotos ou vídeos" : "as fotos"} aqui ou <u>clique para escolher</u><br><span class="xs muted">Até ${BULK_MAX} por lote</span></span><input type="file" class="sr" id="bfile" accept="${accepts()}" multiple></label>
        ${S.flash ? `<div style="margin-top:8px">${notice("warn", esc(S.flash))}</div>` : ""}
        <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:8px"><button class="btn sm" data-lib>Adicionar da biblioteca</button>${S.items.length ? `<button class="btn ghost sm" data-clear>Remover todas</button>` : ""}</div>
        ${keepBox("bkeep", S.keep)}
`)}
      ${step(4, "Horários", `
        <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
          <div><label class="lb" for="bstart">Começar em</label><input id="bstart" type="date" class="field tnum" value="${esc(S.start)}" min="${dayKey(new Date())}"></div>
          <div><label class="lb" for="btimes">Horários do dia</label><input id="btimes" class="field tnum" value="${esc(S.times)}" placeholder="09:00, 12:30, 18:00"><p class="hint">Separe por vírgula.</p></div>
        </div>
        <fieldset style="border:0;padding:0;margin:16px 0 0"><legend class="lb">Dias da semana</legend><div class="row" style="flex-wrap:wrap;gap:6px">${DAYS.map(([d, l]) => `<button type="button" class="opt ${S.days.includes(d) ? "on" : ""}" style="width:48px;padding:6px 0" data-day="${d}" aria-pressed="${S.days.includes(d)}">${l}</button>`).join("")}</div></fieldset>
        <label class="row small" style="gap:8px;margin-top:16px"><input type="checkbox" id="bskip" ${S.skipBusy ? "checked" : ""}> Pular horários que já têm publicação (a menos de 10 minutos)</label>`)}
      ${S.type !== "story" ? step(5, "Legenda padrão", `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px"><select id="btpl" class="field" style="width:auto;max-width:260px" aria-label="Modelo de legenda"><option value="">Modelos de legenda…</option>${tplOptions(templates, S.sel)}</select><button class="btn sm" id="btplins">Inserir</button></div><textarea id="bcap" class="field" rows="3" placeholder="Usada em todas as fotos que estiverem sem legenda própria">${esc(S.caption)}</textarea><p class="hint">Você pode escrever uma legenda específica em cada foto na tabela abaixo.</p><p class="hint" style="margin-top:6px">💡 <strong>Spin de texto:</strong> use <code style="background:var(--surface-1,#f0f0ee);padding:1px 5px;border-radius:4px">{versão A|versão B|versão C}</code> na legenda para que cada mídia receba uma variação diferente automaticamente — sem esforço extra.</p>`) : ""}
      ${S.type !== "story" ? step(6, "Personalizar por conta", perAccountHtml()) : ""}
      <section class="panel"><header><h2>Revisão</h2><span class="small muted tnum">${ready.length} mídia(s) × ${S.sel.length} conta(s) = ${ready.length * S.sel.length} publicação(ões)</span></header>
        ${S.items.length ? `<div class="scroll-x"><table style="min-width:${S.type !== "story" ? 820 : 600}px"><thead><tr><th style="padding-left:20px">#</th><th>Mídia</th>${S.type !== "story" ? "<th>Legenda</th>" : ""}<th>Horário por conta</th><th></th></tr></thead><tbody>
          ${S.items.map((it, i) => { const ri = ready.indexOf(it); return `<tr>
            <td style="padding-left:20px" class="tnum muted">${i + 1}</td>
            <td style="width:120px">${it.preview ? thumb({ url: it.preview, kind: it.kind || "image" }, 64) : it.error ? `<span class="xs bad">${esc(it.error)}</span>` : `<span class="xs muted tnum">${esc(it.state || "Na fila")}</span>`}${it.note ? `<div class="xs muted" style="margin-top:4px;max-width:160px;line-height:1.35">${esc(it.note)}</div>` : ""}</td>
            ${S.type !== "story" ? (() => { const c = it.caption || ""; const tags = (c.match(/#[\p{L}\p{N}_]+/gu)||[]).length; const bad = c.length > 2200 || tags > 30; return `<td><textarea class="field" rows="2" data-cap="${i}" placeholder="${esc(S.caption ? "Legenda padrão" : "Sem legenda")}">${esc(c)}</textarea><div class="row xs muted tnum" style="justify-content:flex-end;gap:10px;margin-top:2px"><span class="${tags>30?"bad":""}">${tags}/30 #</span><span class="${c.length>2200?"bad":""}">${c.length}/2200</span></div></td>`; })() : ""}
            <td class="small">${ri < 0 ? `<span class="muted">Aguardando envio</span>` : S.sel.length ? S.sel.map((id) => `<div class="row" style="gap:6px;justify-content:space-between"><span class="trunc muted">@${esc(accName(id))}</span><span class="tnum">${per[id][ri] ? fDT(per[id][ri]) : `<span class="bad">sem horário</span>`}</span></div>${usePA() ? `<div class="xs muted trunc" style="max-width:34ch;margin:-2px 0 6px" data-prev="${ri}:${esc(id)}" title="${esc(captionFor(it, id, ri))}">${esc((captionFor(it, id, ri) || "Sem legenda").replace(/\s+/g, " ").slice(0, 80))}</div>` : ""}`).join("") : `<span class="muted">Escolha a conta</span>`}</td>
            <td style="white-space:nowrap"><button class="btn ghost sm" data-mv="${i}:-1" aria-label="Subir">↑</button><button class="btn ghost sm" data-mv="${i}:1" aria-label="Descer">↓</button><button class="btn ghost sm" data-rm="${i}" aria-label="Remover">✕</button></td></tr>`; }).join("")}
        </tbody></table></div>` : emptyBox("Nada adicionado ainda", "O que você enviar ou escolher da biblioteca aparece aqui, na ordem em que será publicado.")}
        <div class="pad" style="border-top:1px solid rgb(var(--line))">
          ${missing.length && S.items.length ? `<ul class="small warnc" style="display:grid;gap:4px;margin-bottom:12px">${missing.map((t) => `<li>• ${esc(t)}</li>`).join("")}</ul>` : ""}
          <div id="bmsg" style="margin-bottom:12px">${S.flash ? notice("warn", esc(S.flash)) : ""}</div>
          <button class="btn primary" id="bsubmit" ${can ? "" : "disabled"}>${S.sending ? `<span class="spin"></span>Agendando ${esc(S.sending)}` : `Agendar ${ready.length * S.sel.length || ""} publicações`}</button>
        </div></section></div>`;
    bind();
  }

  function bind() {
    $$("[data-acc]", el).forEach((b) => b.onclick = () => { const id = b.dataset.acc; S.sel = S.sel.includes(id) ? S.sel.filter((x) => x !== id) : [...S.sel, id]; if (S.sel.includes(id)) loadBusy(id); render(); });
    $$("[data-type]", el).forEach((b) => b.onclick = () => { S.type = b.dataset.type; render(); });
    $$("[data-day]", el).forEach((b) => b.onclick = () => { const d = +b.dataset.day; S.days = S.days.includes(d) ? S.days.filter((x) => x !== d) : [...S.days, d]; render(); });
    $("#bstart", el).onchange = (e) => { S.start = e.target.value || dayKey(new Date()); render(); };
    $("#btimes", el).onchange = (e) => { S.times = e.target.value; render(); };
    $("#bskip", el).onchange = (e) => { S.skipBusy = e.target.checked; render(); };
    const cap = $("#bcap", el); if (cap) cap.oninput = (e) => { S.caption = e.target.value; refreshPreviews(); };
    const bt = $("#btplins", el); if (bt) bt.onclick = () => { const t = templates.find((x) => x.id === $("#btpl", el).value); if (!t) return; S.caption = S.caption.trim() ? S.caption.replace(/\s+$/, "") + "\n\n" + t.body : t.body; render(); };
    $$("[data-cap]", el).forEach((t) => t.oninput = (e) => { S.items[+t.dataset.cap].caption = e.target.value; refreshPreviews(); });
    const bpa = $("#bpa", el); if (bpa) bpa.onchange = (e) => { S.perAcc = e.target.checked; render(); };
    const btm = $("#btm", el); if (btm) btm.onchange = (e) => { S.tplMode = e.target.value; render(); };
    $$("[data-atpl]", el).forEach((c) => c.onchange = () => { const [id, tid] = c.dataset.atpl.split(":"), a = accSet(id); a.tplIds = c.checked ? [...a.tplIds, tid] : a.tplIds.filter((x) => x !== tid); render(); });
    $$("[data-atext]", el).forEach((t) => t.oninput = () => { accSet(t.dataset.atext).text = t.value; refreshPreviews(); });
    $$("[data-acm]", el).forEach((b) => b.onclick = () => { const [id, mode] = b.dataset.acm.split(":"); accSet(id).cover = mode; render(); });
    $$("[data-afr]", el).forEach((i) => i.onchange = () => { accSet(i.dataset.afr).frameSec = Math.max(0, +i.value || 0); });
    $$("[data-aimg]", el).forEach((inp) => inp.onchange = async () => {
      const id = inp.dataset.aimg, f = inp.files[0]; if (!f) return;
      const st = $(`[data-aimgst="${id}"]`, el); if (st) st.textContent = "Enviando…";
      try {
        const pr = await prepareImage(f, "story");
        const r = await api("/media", { method: "POST", body: { fileName: pr.file.name, mimeType: pr.file.type, sizeBytes: pr.file.size, keep: S.keep } });
        await putFile(r.uploadUrl, pr.file, () => { });
        const c = await api(`/media/${r.mediaId}/complete`, { method: "POST" });
        Object.assign(accSet(id), { coverMediaId: r.mediaId, coverPreview: c.previewUrl }); render();
        /* capa é imagem, não vídeo — sem awaitReady necessário */
      } catch (x) { if (st) st.textContent = x.message; }
    });
    $$("[data-rm]", el).forEach((b) => b.onclick = () => { S.items.splice(+b.dataset.rm, 1); render(); });
    $$("[data-mv]", el).forEach((b) => b.onclick = () => { const [i, d] = b.dataset.mv.split(":").map(Number), j = i + d; if (j < 0 || j >= S.items.length) return; [S.items[i], S.items[j]] = [S.items[j], S.items[i]]; render(); });
    const bk = $("#bkeep", el); if (bk) bk.onchange = (e) => { S.keep = e.target.checked; localStorageSet(keepKey, S.keep ? "1" : null); };
    $("[data-lib]", el).onclick = () => pickFromLibrary();
    const clr = $("[data-clear]", el); if (clr) clr.onclick = () => { if (confirm("Remover todas as fotos desta lista?")) { S.items = []; render(); } };
    $("#bfile", el).onchange = (e) => { const f = [...e.target.files]; e.target.value = ""; handleFiles(f); };
    const drop = $("#bdrop", el);
    drop.ondragover = (e) => { e.preventDefault(); drop.style.borderColor = "rgb(var(--ink))"; };
    drop.ondragleave = () => { drop.style.borderColor = ""; };
    drop.ondrop = (e) => { e.preventDefault(); drop.style.borderColor = ""; handleFiles(e.dataTransfer.files); };
    $("#bsubmit", el).onclick = submit;
  }

  /** Recebe os arquivos escolhidos ou arrastados: ajusta o formato quando dá e nunca ignora nada em silêncio. */
  function handleFiles(list) {
    const files = [...list];
    if (!files.length) return;
    S.flash = "";
    const isVid = (f) => f.type.startsWith("video") || /\.(mp4|mov)$/i.test(f.name);
    const vids = files.filter(isVid).length, imgs = files.length - vids;
    if (!S.items.length) {
      if (vids && !imgs && S.type === "image") S.type = "reel";
      else if (imgs && !vids && S.type === "reel") S.type = "image";
    }
    const ok = files.filter(fits), skipped = files.length - ok.length;
    if (skipped) S.flash = `${skipped} arquivo(s) ignorado(s): o formato ${S.type === "reel" ? "Reel aceita só vídeos (MP4 ou MOV)" : S.type === "image" ? "Imagem no feed aceita só fotos (JPEG, PNG ou HEIC)" : "Story aceita fotos e vídeos MP4/MOV"}. ${vids && imgs ? "Para misturar fotos e vídeos no mesmo lote, use o formato Story, ou faça um lote para cada tipo." : ""}`;
    if (!ok.length) { render(); return; }
    addFiles(ok);
  }

  /** Prepara (limpa metadados, converte, recorta) e envia, 3 por vez. */
  async function addFiles(files) {
    const room = BULK_MAX - S.items.length;
    if (files.length > room) S.flash = `Só cabem mais ${room} item(ns) neste lote (máximo ${BULK_MAX}); os demais foram ignorados.`;
    const fresh = files.slice(0, Math.max(0, room)).map((f) => ({ file: f, name: f.name, kind: f.type.startsWith("video") ? "video" : "image", caption: "", state: "Na fila" }));
    S.items.push(...fresh); render();
    let next = 0;
    const worker = async () => {
      while (next < fresh.length) {
        const it = fresh[next++];
        if (!S.items.includes(it)) continue;
        try {
          it.state = "Limpando e preparando…"; render();
          const pr = it.kind === "video" ? await prepareVideo(it.file, S.type) : await prepareImage(it.file, S.type);
          it.note = pr.note; it.ratio = pr.ratio; it.state = "Enviando…"; render();
          const r = await api("/media", { method: "POST", body: { fileName: pr.file.name, mimeType: pr.file.type, sizeBytes: pr.file.size, keep: S.keep } });
          await putFile(r.uploadUrl, pr.file, () => { });
          let c = await api(`/media/${r.mediaId}/complete`, { method: "POST" });
          if (c.status === "pending") {
            it.state = "Otimizando vídeo…"; render();
            c = await awaitReady(r.mediaId, c);
          }
          Object.assign(it, { mediaId: r.mediaId, preview: c.previewUrl, state: "" });
          delete it.file;
        } catch (e) { it.error = e.message; }
        render();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
  }

  async function pickFromLibrary() {
    const lib = (await api(libKeepCache === false ? "/library?all=1" : "/library")).items.filter((m) => S.type === "reel" ? m.kind === "video" : S.type === "image" ? m.kind === "image" : true);
    const chosen = new Set();
    openDrawer("Adicionar da biblioteca", lib.length ? `<p class="small muted" style="margin-top:0">${libKeepCache === false ? "Arquivos enviados nas últimas 24 h que combinam com o formato" : "Só aparece o que foi guardado e combina com o formato"} ${S.type === "reel" ? "Reel" : S.type === "story" ? "Story" : "Imagem"}.</p>
      <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${lib.map((m) => `<label class="panel" style="padding:8px;cursor:pointer"><input type="checkbox" data-pick="${esc(m.id)}"> ${m.kind === "video" ? `<span class="muted small" style="width:100%;aspect-ratio:1;display:grid;place-items:center;background:rgb(var(--sunken));border-radius:6px">▶ Vídeo</span>` : `<img src="${esc(m.previewUrl || "")}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px">`}<div class="xs trunc">${esc(m.fileName)}</div><div class="xs muted">Publicada ${m.published}x</div></label>`).join("")}</div>
      <button class="btn primary" id="pickok" style="margin-top:16px;width:100%">Adicionar selecionadas</button>`
      : (libKeepCache === false ? emptyBox("Nada disponível para este formato", "Os arquivos ficam disponíveis por 24 horas depois do envio. Envie de novo para usar.") : emptyBox("Nada guardado para este formato", "Marque \"Guardar na biblioteca\" ao enviar, ou guarde mídias na página Biblioteca.")), (body) => {
      $$("[data-pick]", body).forEach((c) => c.onchange = () => { c.checked ? chosen.add(c.dataset.pick) : chosen.delete(c.dataset.pick); $("#pickok", body).textContent = `Adicionar ${chosen.size || ""} selecionada(s)`; });
      const okb = $("#pickok", body); if (okb) okb.onclick = () => {
        const room = BULK_MAX - S.items.length;
        S.items.push(...lib.filter((m) => chosen.has(m.id)).slice(0, room).map((m) => ({ name: m.fileName, kind: m.kind, mediaId: m.id, preview: m.previewUrl, caption: "", note: "Da biblioteca" })));
        closeDrawer(); render();
      };
    });
  }

  async function submit() {
    if (S.sending) return;
    const { ready, per } = plan();
    const problems = validatePerAccount(ready);
    if (problems.length) { $("#bmsg", el).innerHTML = notice("bad", problems.map(esc).join("<br>")); return; }
    if (!confirm(`Agendar ${ready.length * S.sel.length} publicação(ões) em ${S.sel.length} conta(s)?${usePA() ? "\n\nCada conta recebe um post próprio, com a legenda e a capa definidas para ela." : ""}`)) return;
    const tasks = buildTasks(ready), results = [];
    let finished = 0, next = 0;
    S.sending = `0 de ${tasks.length}`; render();
    const worker = async () => {
      while (next < tasks.length) {
        const t = tasks[next++], acc = usePA() ? t.ids[0] : null;
        try { await api("/posts", { method: "POST", body: taskBody(t, per) }); results.push({ it: t.it, acc, ok: true, when: t.ids.map((id) => per[id][t.i]) }); }
        catch (e) { results.push({ it: t.it, acc, ok: false, error: e.message }); }
        finished++; S.sending = `${finished} de ${tasks.length}`; render();
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    S.sending = false; S.done = results; render();
  }

  function renderDone() {
    const ok = S.done.filter((r) => r.ok), bad = S.done.filter((r) => !r.ok);
    el.innerHTML = head("Lote agendado") + `<section class="panel pad stack">
      <p style="font-size:17px;margin:0"><strong>${ok.reduce((n, r) => n + r.when.length, 0)}</strong> publicação(ões) agendada(s) a partir de ${new Set(ok.map((r) => r.it)).size} mídia(s).</p>
      ${ok.length ? `<p class="small muted" style="margin:0">Primeira: ${fDT(new Date(Math.min(...ok.flatMap((r) => r.when.map(Number)))))}. Última: ${fDT(new Date(Math.max(...ok.flatMap((r) => r.when.map(Number)))))}.</p>` : ""}
      ${bad.length ? notice("bad", `${bad.length} publicação(ões) não foram agendadas:<br>${bad.map((r) => `${esc(r.it.name)}${r.acc ? " (@" + esc(accNameOf(r.acc)) + ")" : ""}: ${esc(r.error)}`).join("<br>")}`) : ""}
      <div class="row" style="gap:8px"><a class="btn primary" href="#/calendar">Ver no calendário</a><a class="btn" href="#/bulk" onclick="setTimeout(route)">Novo lote</a></div></section>`;
  }

  render();
};


/* ===================== Biblioteca ===================== */
PAGES["/library"] = async (el) => {
  const temp = (await libKeepEnabled()) === false;
  let all = temp;
  const expiry = (m) => { if (m.pending) return "Apagado 24 h depois da última publicação"; const h = Math.ceil((new Date(m.createdAt).getTime() + 864e5 - Date.now()) / 36e5); return h > 1 ? `Apagado em até ${h} h` : "Será apagado em breve"; };
  const sel = new Set();
  const load = async () => {
    const d = await api(`/library${all ? "?all=1" : ""}`);
    const freeGb = 1e9, pct = Math.min(100, Math.round((d.usedBytes / freeGb) * 100));
    el.innerHTML = head("Biblioteca", temp ? "Fotos e vídeos enviados recentemente. Cada arquivo fica disponível por 24 horas e depois é apagado automaticamente." : "Fotos e vídeos guardados para repostar. O que não está guardado é apagado automaticamente 24 h depois de publicado em todas as contas.",
      `<a class="btn primary ${sel.size ? "" : "disabled"}" id="lbulk" href="${sel.size ? `#/bulk?media=${[...sel].join(",")}` : "javascript:void 0"}" ${sel.size ? "" : `aria-disabled="true" style="opacity:.5;pointer-events:none"`}>Agendar ${sel.size || ""} em massa</a>`)
      + `<section class="panel pad" style="margin-bottom:20px">
          <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="small">Armazenamento em uso: <strong class="tnum">${fmtBytes(d.usedBytes)}</strong> ${temp ? "" : `<span class="muted">(guardado na biblioteca: ${fmtBytes(d.keptBytes)})</span>`}</span><span class="xs muted tnum">${pct}% de 1 GB do plano gratuito</span></div>
          <div style="height:6px;background:rgb(var(--sunken));border-radius:99px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${pct}%;background:rgb(var(--${pct > 85 ? "bad" : pct > 60 ? "warn" : "ink"}))"></div></div>
          ${temp ? `<div style="margin-top:14px">${notice("warn", TEMP_NOTE)}</div>` : `<label class="row small" style="gap:8px;margin-top:14px"><input type="checkbox" id="lall" ${all ? "checked" : ""}> Mostrar também o que não está guardado (será apagado depois de publicado)</label>`}
        </section><div id="lmsg" style="margin-bottom:16px"></div>`
      + (d.items.length ? `<div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${d.items.map((m) => `
        <article class="panel" style="overflow:hidden;${sel.has(m.id) ? "outline:2px solid rgb(var(--ink));outline-offset:-2px" : ""}">
          <label style="display:block;position:relative;cursor:pointer">
            ${m.kind === "video" ? `<video src="${esc(m.previewUrl || "")}" muted controls preload="none" style="width:100%;aspect-ratio:1;object-fit:cover;display:block;background:rgb(var(--sunken))"></video>` : `<img src="${esc(m.previewUrl || "")}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;display:block;background:rgb(var(--sunken))">`}
            <input type="checkbox" data-sel="${esc(m.id)}" ${sel.has(m.id) ? "checked" : ""} style="position:absolute;top:10px;left:10px;width:18px;height:18px" aria-label="Selecionar ${esc(m.fileName)}">
            ${m.kind === "video" ? `<span class="badge t-idle" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff">Vídeo</span>` : ""}
          </label>
          <div style="padding:10px 12px">
            <div class="small trunc" style="font-weight:500">${esc(m.fileName)}</div>
            <div class="xs muted tnum">${fmtBytes(m.sizeBytes)}, publicada ${m.published}x${m.pending ? `, ${m.pending} agendada(s)` : ""}</div>${temp ? `<div class="xs warnc" style="margin-top:2px">${expiry(m)}</div>` : ""}
            <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px">
              <a class="btn sm" href="#/compose?media=${esc(m.id)}">Agendar</a>
              <button class="btn sm" data-replicate="${esc(m.id)}" data-name="${esc(m.fileName)}" data-kind="${esc(m.kind)}">Replicar</button>
              ${temp ? "" : `<button class="btn sm ghost" data-keep="${esc(m.id)}" data-v="${!m.keep}">${m.keep ? "Não guardar" : "Guardar"}</button>`}
              <button class="btn sm ghost bad" data-del="${esc(m.id)}" aria-label="Apagar ${esc(m.fileName)}">Apagar</button>
            </div>
          </div>
        </article>`).join("")}</div>`
      : `<section class="panel">${emptyBox(temp ? "Nenhum arquivo nas últimas 24 h" : all ? "Nenhuma mídia no armazenamento" : "Nada guardado ainda", temp ? "Os arquivos enviados em Agendar ou Em massa aparecem aqui por 24 horas." : "Ao enviar fotos ou vídeos em Agendar ou Em massa, marque \"Guardar na biblioteca para repostar\".", `<a class="btn sm" href="#/bulk">Ir para Em massa</a>`)}</section>`);
    const msg = (t, x) => $("#lmsg", el).innerHTML = notice(t, esc(x));
    const lall = $("#lall", el); if (lall) lall.onchange = (e) => { all = e.target.checked; load(); };
    $$("[data-sel]", el).forEach((c) => c.onchange = () => { c.checked ? sel.add(c.dataset.sel) : sel.delete(c.dataset.sel); load(); });
    $$("[data-keep]", el).forEach((b) => b.onclick = async () => { busy(b, true); try { await api(`/media/${b.dataset.keep}`, { method: "PATCH", body: { keep: b.dataset.v === "true" } }); await load(); } catch (e) { msg("bad", e.message); busy(b, false); } });
    $$("[data-del]", el).forEach((b) => b.onclick = async () => {
      if (!confirm("Apagar este arquivo do armazenamento agora? Não dá para desfazer; posts já publicados no Instagram não são afetados.")) return;
      busy(b, true);
      try { await api(`/media/${b.dataset.del}`, { method: "DELETE" }); sel.delete(b.dataset.del); await load(); msg("ok", "Arquivo apagado."); } catch (e) { msg("bad", e.message); busy(b, false); }
    });

    // ── Botão Replicar ─────────────────────────────────────────────
    $$("[data-replicate]", el).forEach((b) => b.onclick = async () => {
      const mediaId = b.dataset.replicate;
      const mediaName = b.dataset.name;
      const mediaKind = b.dataset.kind;

      // carrega contas e templates pra montar o modal
      let accounts = [], templates = [];
      try {
        const [acc, tpl] = await Promise.all([api("/accounts"), api("/templates")]);
        accounts = acc.accounts.filter((a) => a.status === "active");
        templates = tpl.templates || [];
      } catch (e) { msg("bad", e.message); return; }

      if (!accounts.length) { msg("bad", "Nenhuma conta ativa conectada."); return; }

      // modal
      const overlay = document.createElement("div");
      overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
      overlay.innerHTML = `
        <div style="background:rgb(var(--surface,255 255 255));border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto">
          <h2 style="font-size:17px;font-weight:600;margin-bottom:4px">Replicar vídeo</h2>
          <p class="muted xs" style="margin-bottom:20px">${esc(mediaName)} — cada cópia recebe fingerprint único automaticamente.</p>

          <label class="lb">Quantas cópias</label>
          <input id="rep-count" type="number" class="field" min="1" max="500" value="10" style="margin-bottom:16px">

          <label class="lb">Contas</label>
          <div id="rep-accounts" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">
            ${accounts.map((a) => `<label class="row small" style="gap:8px"><input type="checkbox" data-acc="${esc(a.id)}" checked> @${esc(a.username)}</label>`).join("")}
          </div>

          <label class="lb">Legenda padrão <span class="muted xs">(opcional — spin: {versão A|versão B})</span></label>
          <textarea id="rep-caption" class="field" rows="3" placeholder="Sem legenda" style="margin-bottom:8px"></textarea>
          <p class="hint" style="margin-bottom:16px">Dica: use <code style="background:rgb(var(--sunken));padding:1px 5px;border-radius:4px">{opção 1|opção 2|opção 3}</code> pra variar a legenda em cada cópia automaticamente.</p>

          <label class="lb">Primeiro horário</label>
          <input id="rep-start" type="datetime-local" class="field" style="margin-bottom:8px" value="${new Date(Date.now() + 3600_000).toISOString().slice(0,16)}">

          <label class="lb">Intervalo entre posts (minutos)</label>
          <input id="rep-interval" type="number" class="field" min="5" max="1440" value="60" style="margin-bottom:20px">

          <div id="rep-msg" style="margin-bottom:12px"></div>
          <div class="row" style="gap:8px;justify-content:flex-end">
            <button id="rep-cancel" class="btn">Cancelar</button>
            <button id="rep-go" class="btn primary">Agendar cópias</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      const close = () => document.body.removeChild(overlay);
      overlay.querySelector("#rep-cancel").onclick = close;
      overlay.onclick = (e) => { if (e.target === overlay) close(); };

      overlay.querySelector("#rep-go").onclick = async () => {
        const goBtn = overlay.querySelector("#rep-go");
        const rmsg  = overlay.querySelector("#rep-msg");
        const count = Math.max(1, Math.min(500, +overlay.querySelector("#rep-count").value || 10));
        const selAccs = [...overlay.querySelectorAll("[data-acc]:checked")].map((c) => c.dataset.acc);
        const caption = overlay.querySelector("#rep-caption").value.trim();
        const startMs = new Date(overlay.querySelector("#rep-start").value).getTime();
        const intervalMs = Math.max(5, +overlay.querySelector("#rep-interval").value || 60) * 60_000;

        if (!selAccs.length) { rmsg.innerHTML = notice("bad", "Escolha ao menos uma conta."); return; }
        if (isNaN(startMs))  { rmsg.innerHTML = notice("bad", "Escolha o primeiro horário."); return; }

        busy(goBtn, true);
        rmsg.innerHTML = notice("ok", `Agendando ${count} cópias…`);

        // spin de texto: {A|B|C} → variação por índice
        const spin = (text, idx) => text.replace(/\{([^{}]+)\}/g, (_, inner) => {
          const opts = inner.split("|"); return opts[idx % opts.length];
        });

        let ok = 0, fail = 0;
        for (let i = 0; i < count; i++) {
          const scheduledAt = new Date(startMs + i * intervalMs).toISOString();
          const cap = spin(caption, i);
          // distribui entre as contas selecionadas em round-robin
          const accId = selAccs[i % selAccs.length];
          try {
            await api("/posts", {
              method: "POST",
              body: {
                type: mediaKind === "video" ? "reel" : "image",
                caption: cap,
                mediaIds: [mediaId],
                mode: "schedule",
                accounts: [{ accountId: accId, times: [scheduledAt] }],
                options: {},
              },
            });
            ok++;
          } catch (e) {
            fail++;
            console.warn(`[replicate] cópia ${i+1}:`, e.message);
          }
          // atualiza progresso
          if ((i + 1) % 5 === 0 || i === count - 1) {
            rmsg.innerHTML = notice("ok", `${ok} de ${count} agendadas${fail ? ` (${fail} falhas)` : ""}…`);
          }
        }

        if (ok > 0) {
          rmsg.innerHTML = notice("ok", `✓ ${ok} publicação(ões) agendada(s)${fail ? ` — ${fail} falha(s)` : ""}.`);
          setTimeout(close, 2000);
          await load();
        } else {
          rmsg.innerHTML = notice("bad", `Todas as ${count} tentativas falharam.`);
          busy(goBtn, false);
        }
      };
    });
  };
  await load();
};

/* ===================== Métricas ===================== */
const WD = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const fmtN = (n) => n == null ? "–" : new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 }).format(n);
const fmtPct = (x) => (x * 100).toFixed(1).replace(".", ",") + "%";
const hh = (h) => String(h).padStart(2, "0") + ":00";

function insChart(daily) {
  if (!daily.length) return "";
  const W = 640, H = 120, pad = 4, max = Math.max(1, ...daily.map((d) => d.reach)), bw = (W - pad * 2) / daily.length;
  const dm = (d) => d.split("-").reverse().slice(0, 2).join("/");
  const bars = daily.map((d, i) => {
    const h = d.reach ? Math.max(2, (d.reach / max) * (H - 24)) : 0;
    return `<rect x="${(pad + i * bw + 1).toFixed(1)}" y="${(H - 16 - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" style="fill:rgb(var(--ink))"><title>${esc(dm(d.day))}: ${esc(fmtN(d.reach))}</title></rect>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Alcance por dia" style="width:100%;height:auto;display:block">${bars}<text x="${pad}" y="${H - 2}" style="fill:rgb(var(--muted));font-size:11px">${esc(dm(daily[0].day))}</text><text x="${W - pad}" y="${H - 2}" text-anchor="end" style="fill:rgb(var(--muted));font-size:11px">${esc(dm(daily[daily.length - 1].day))}</text></svg>`;
}
function insBannersHtml(accounts) {
  const need = accounts.filter((a) => a.insights && a.insights.status === "needs_permission");
  const err = accounts.filter((a) => a.insights && a.insights.status === "error");
  let h = "";
  if (need.length) h += `<div class="notice warn" style="margin-bottom:12px"><strong>Falta autorizar as métricas</strong> em ${need.map((a) => "@" + esc(a.username)).join(", ")}. Clique em autorizar, entre no Instagram e aceite a nova permissão. Os dados aparecem em até 20 minutos.
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">${need.map((a) => `<button class="btn sm primary" data-iauth="${esc(a.id)}">Autorizar @${esc(a.username)}</button>`).join("")}</div>
    <p class="xs" style="margin:10px 0 0">Se o Instagram mostrar erro de permissão, abra o app na Meta, vá em <em>Casos de uso &gt; Permissões e recursos</em> e adicione <code>instagram_business_manage_insights</code>. Enquanto o app está em desenvolvimento, isso vale para contas com função de testador, sem revisão.</p></div>`;
  for (const a of err) h += `<div style="margin-bottom:12px">${notice("bad", `@${esc(a.username)}: ${esc(a.insights.message || "erro ao buscar métricas")}`)}</div>`;
  return h;
}
function insFormatsHtml(formats) {
  if (!formats.length) return `<p class="small muted" style="margin:0">Sem métricas ainda neste período.</p>`;
  return `<div class="scroll-x"><table style="min-width:420px"><thead><tr><th style="padding-left:20px">Formato</th><th>Posts</th><th>Alcance mediano</th><th>Views médias</th><th>Engajamento</th></tr></thead><tbody>
    ${formats.map((f) => `<tr><td style="padding-left:20px;font-weight:500">${esc(TYPE[f.type] || f.type)}</td><td class="tnum">${f.posts}</td><td class="tnum">${fmtN(f.medianReach)}</td><td class="tnum">${fmtN(f.avgViews)}</td><td class="tnum">${fmtPct(f.engagementRate)}</td></tr>`).join("")}</tbody></table></div>
    ${formats.length < 2 ? `<p class="hint" style="padding:0 20px 16px">Para comparar formatos, publique mais de um tipo.</p>` : ""}`;
}
function insBestHtml(a) {
  if (!a) return `<p class="small muted" style="margin:0">Conecte uma conta para ver os melhores horários.</p>`;
  const b = a.best;
  if (!b.enough) return `<p class="small muted" style="margin:0">Ainda há poucos dados em @${esc(a.username)}: ${b.n} post(s) com métricas. Com pelo menos 6, o painel mostra os melhores horários e dias.</p>`;
  const maxLift = Math.max(1, ...b.hours.map((h) => h.lift)), pct = (l) => (l >= 1 ? "+" : "") + Math.round((l - 1) * 100) + "%";
  return `<div class="small muted" style="margin-bottom:10px">Mediana de @${esc(a.username)}: <strong class="tnum">${fmtN(b.overallMedianReach)}</strong> de alcance por post (${b.n} posts).</div>
    <h3 style="font-size:13px;margin:0 0 8px">Melhores horas</h3>
    <ul style="display:grid;gap:8px">${b.hours.map((h) => `<li class="row" style="gap:10px"><span class="tnum small" style="width:46px">${hh(h.hour)}</span><span style="flex:1;height:8px;background:rgb(var(--sunken));border-radius:99px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round((h.lift / maxLift) * 100)}%;background:rgb(var(--ink))"></span></span><span class="xs tnum" style="width:150px;text-align:right">${fmtN(h.medianReach)} <span class="muted">(${pct(h.lift)}, ${h.n} posts)</span></span></li>`).join("")}</ul>
    ${b.days.length ? `<h3 style="font-size:13px;margin:16px 0 8px">Melhores dias</h3><p class="small" style="margin:0">${b.days.map((d) => `<strong style="font-weight:500">${WD[d.weekday]}</strong> <span class="muted">(${pct(d.lift)}, ${d.n} posts)</span>`).join(", ")}</p>` : ""}
    ${b.suggestedTimes.length ? `<button class="btn sm primary" style="margin-top:16px" data-itimes="${esc(a.id)}" data-times="${esc(b.suggestedTimes.join(","))}">Usar ${esc(b.suggestedTimes.join(", "))} como horários da conta</button>` : `<p class="hint" style="margin-top:12px">Nenhum horário passou da mediana da conta.</p>`}
    <p class="hint" style="margin-top:12px">Isto é uma pista tirada dos seus posts, não uma garantia: o tipo de conteúdo pesa mais que o horário.</p>`;
}
function insTopHtml(top) {
  if (!top.length) return emptyBox("Sem métricas ainda", "As métricas aparecem algumas horas depois da publicação e se atualizam sozinhas.");
  return `<div class="scroll-x"><table style="min-width:820px"><thead><tr><th style="padding-left:20px">Post</th><th>Alcance</th><th>Views</th><th>Curtidas</th><th>Coment.</th><th>Compart.</th><th>Salvos</th><th>Engaj.</th><th>Tempo médio</th><th></th></tr></thead><tbody>
    ${top.map((t) => `<tr class="click" tabindex="0" data-it="${esc(t.targetId)}"><td style="padding-left:20px"><div class="row">${thumb(t.thumb, 40)}<div style="min-width:0"><div style="font-weight:500">${esc(TYPE[t.type] || t.type)} <span class="muted" style="font-weight:400">@${esc(t.username)}</span></div><div class="xs muted">${fDT(t.publishedAt)}</div></div></div></td>
      <td class="tnum" style="font-weight:600">${fmtN(t.reach)}</td><td class="tnum">${fmtN(t.views)}</td><td class="tnum">${fmtN(t.likes)}</td><td class="tnum">${fmtN(t.comments)}</td><td class="tnum">${fmtN(t.shares)}</td><td class="tnum">${fmtN(t.saved)}</td>
      <td class="tnum">${t.reach ? fmtPct(t.interactions / t.reach) : "–"}</td><td class="tnum">${t.avgWatchMs ? (t.avgWatchMs / 1000).toFixed(1).replace(".", ",") + " s" : "–"}</td>
      <td>${t.permalink ? `<a class="accentc small" href="${esc(t.permalink)}" target="_blank" rel="noreferrer" data-stop>Abrir</a>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
}

PAGES["/insights"] = async (el) => {
  const accs = (await api("/accounts")).accounts;
  let days = 30, accFilter = "", bestAcc = "", data = null;
  el.innerHTML = head("Métricas", "Alcance, interações e os melhores horários dos seus posts. Os números vêm do Instagram e se atualizam sozinhos.",
    `<select id="idays" class="field" style="width:auto" aria-label="Período">${[[7, "7 dias"], [30, "30 dias"], [90, "90 dias"]].map(([v, l]) => `<option value="${v}" ${v === days ? "selected" : ""}>${l}</option>`).join("")}</select>
     <select id="iacc" class="field" style="width:auto" aria-label="Conta"><option value="">Todas as contas</option>${accs.map((a) => `<option value="${esc(a.id)}">@${esc(a.username)}</option>`).join("")}</select>
     <button class="btn" id="irefresh">Atualizar agora</button>`) + `<div id="imsg" style="margin-bottom:16px"></div><div id="ibody"><p class="muted">Carregando…</p></div>`;

  const msg = (t, h) => { const m = $("#imsg", el); if (m) m.innerHTML = notice(t, h); };

    const d = data, t = d.totals;

    const kpi = [["Posts publicados", t.posts], ["Alcance", fmtN(t.reach)], ["Visualizações", fmtN(t.views)], ["Interações", fmtN(t.interactions)], ["Engajamento", fmtPct(t.engagementRate)], ["Sem métricas ainda", d.pending]];
    $("#ibody", el).innerHTML = insBannersHtml(d.accounts)
      + (d.totals.posts === 0 ? `<div class="panel">${emptyBox("Nenhum post publicado neste período", "Quando houver publicações, as métricas aparecem aqui.", `<a class="btn sm" href="#/compose">Agendar publicação</a>`)}</div>` : `
      <div class="panel stats">${kpi.map(([l, v]) => `<div class="stat"><div class="small muted">${l}</div><div class="v tnum">${v}</div></div>`).join("")}</div>
      <section class="panel" style="margin-bottom:24px"><header><h2>Alcance por dia</h2><span class="xs muted">soma dos posts publicados em cada dia</span></header><div class="pad">${insChart(d.daily)}</div></section>
      <div class="grid2" style="grid-template-columns:1fr 1fr;margin-bottom:24px">
        <section class="panel"><header><h2>Formatos</h2><span class="xs muted">mediana de alcance por post</span></header>${insFormatsHtml(d.formats)}</section>
        <section class="panel"><header><h2>Melhores horários</h2><select id="ibest" class="field" style="width:auto;padding:4px 8px" aria-label="Conta">${d.accounts.map((a) => `<option value="${esc(a.id)}" ${a.id === bestAcc ? "selected" : ""}>@${esc(a.username)}</option>`).join("")}</select></header><div class="pad" id="ibestbox">${insBestHtml(d.accounts.find((a) => a.id === bestAcc))}</div></section>
      </div>
      <section class="panel"><header><h2>Posts com mais alcance</h2></header>${insTopHtml(d.top)}</section>
      <p class="hint" style="margin-top:16px">Atualização automática a cada 20 minutos: de 3 em 3 horas nos 2 primeiros dias de cada post, depois uma vez por dia. ${d.lastFetchedAt ? `Última atualização: ${fDT(d.lastFetchedAt)}.` : ""} Stories só têm métricas nas primeiras 24 horas e posts anteriores à conversão da conta em profissional não têm dados.</p>`);
    bind();
  };
  function bind() {
    $$("[data-iauth]", el).forEach((b) => b.onclick = async () => {
      busy(b, true);
      try { const r = await api("/authorize", { method: "POST", body: { accountId: b.dataset.iauth, returnTo: location.origin + location.pathname }, base: INSIGHTS_API }); location.href = r.url; }
      catch (e) { msg("bad", esc(e.message)); busy(b, false); }
    });
    const bs = $("#ibest", el); if (bs) bs.onchange = () => { bestAcc = bs.value; $("#ibestbox", el).innerHTML = insBestHtml(data.accounts.find((a) => a.id === bestAcc)); bindTimes(); };
    bindTimes();
    $$("[data-it]", el).forEach((r) => { r.onclick = (e) => { if (e.target.closest("[data-stop]")) return; openTarget(r.dataset.it); }; r.onkeydown = (e) => e.key === "Enter" && openTarget(r.dataset.it); });
  }
  function bindTimes() {
    $$("[data-itimes]", el).forEach((b) => b.onclick = async () => {
      const a = data.accounts.find((x) => x.id === b.dataset.itimes);
      if (!confirm(`Definir ${b.dataset.times.split(",").join(", ")} como horários preferidos de @${a.username}? Eles passam a ser sugeridos ao agendar e no Em massa.`)) return;
      busy(b, true);
      try { await api(`/accounts/${a.id}`, { method: "PATCH", body: { defaultTimes: b.dataset.times.split(",") } }); msg("ok", `Horários de @${esc(a.username)} atualizados.`); }
      catch (e) { msg("bad", esc(e.message)); }
      busy(b, false);
    });
  }
  $("#idays", el).onchange = (e) => { days = +e.target.value; load().catch((x) => msg("bad", esc(x.message))); };
  $("#iacc", el).onchange = (e) => { accFilter = e.target.value; bestAcc = ""; load().catch((x) => msg("bad", esc(x.message))); };
  $("#irefresh", el).onclick = async (e) => {
    const b = e.currentTarget; busy(b, true);
    try { const r = await api("/refresh", { method: "POST", body: { accountId: accFilter || undefined }, base: INSIGHTS_API }); await load();
      msg(r.needsPermission ? "warn" : "ok", r.needsPermission ? "Há contas sem a permissão de métricas. Veja o aviso abaixo." : `${r.updated} post(s) atualizado(s)${r.checked > r.updated ? `, ${r.checked - r.updated} sem dados novos` : ""}.`); }
    catch (x) { msg("bad", esc(x.message)); }
    busy(b, false);
  };
  await load();
  every(120000, () => { if (!$("#drawer-root .drawer")) load().catch(() => { }); });
};

/* ===================== Calendário ===================== */
PAGES["/calendar"] = async (el) => {
  const now = new Date(); let month = new Date(now.getFullYear(), now.getMonth(), 1), acc = "", items = [];
  const accs = (await api("/accounts")).accounts;
  const load = async () => {
    const gs = new Date(month); gs.setDate(1 - ((gs.getDay() + 6) % 7));
    const days = Array.from({ length: 42 }, (_, i) => { const d = new Date(gs); d.setDate(d.getDate() + i); return d; });
    const end = new Date(gs); end.setDate(end.getDate() + 42);
    const qs = new URLSearchParams({ from: gs.toISOString(), to: end.toISOString(), limit: "500" }); if (acc) qs.set("accountId", acc);
    items = (await api(`/targets?${qs}`)).items.filter((i) => i.status !== "canceled");
    const by = {}; items.forEach((i) => (by[dayKey(new Date(i.scheduledAt))] ||= []).push(i));
    const today = dayKey(new Date());
    el.innerHTML = head("Calendário", "Arraste um post para outro dia para reagendar no mesmo horário. Clique em Agendar num dia para criar nele.", `<select id="cacc" class="field" style="width:auto" aria-label="Filtrar conta"><option value="">Todas as contas</option>${accs.map((a) => `<option value="${esc(a.id)}" ${acc === a.id ? "selected" : ""}>@${esc(a.username)}</option>`).join("")}</select><a class="btn primary" href="#/compose">Agendar publicação</a>`)
      + `<div id="calmsg" style="margin-bottom:16px"></div><section class="panel" style="overflow:hidden"><header><h2 style="text-transform:capitalize;font-size:18px">${new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric" }).format(month)}</h2><div class="row" style="gap:4px"><button class="btn ghost sm" data-m="-1">Anterior</button><button class="btn ghost sm" data-m="0">Hoje</button><button class="btn ghost sm" data-m="1">Próximo</button></div></header>
      <div class="scroll-x"><div class="cal">${["seg", "ter", "qua", "qui", "sex", "sáb", "dom"].map((w) => `<div class="wd">${w}</div>`).join("")}
      ${days.map((d) => { const k = dayKey(d), list = (by[k] || []).sort((a, b) => new Date(a.scheduledAt) - new Date(b.scheduledAt)), past = k < today;
        return `<div class="day ${d.getMonth() !== month.getMonth() ? "out" : ""}" data-day="${k}" data-past="${past}"><div class="row" style="justify-content:space-between;padding:0 4px 4px"><span class="num tnum ${k === today ? "today" : ""}">${d.getDate()}</span>${past ? "" : `<a class="add" href="#/compose?date=${k}">Agendar</a>`}</div>
        ${list.slice(0, 4).map((i) => { const dr = ["scheduled", "paused", "failed"].includes(i.status); return `<button class="ev" data-t="${esc(i.id)}" ${dr ? `draggable="true" style="cursor:grab"` : ""}><span class="dot d-${STATUS[i.status][1]}"></span><span class="tnum muted">${fTime(i.scheduledAt)}</span><span class="trunc">@${esc(i.username)}</span><span class="sr">${TYPE[i.type]}, ${STATUS[i.status][0]}</span></button>`; }).join("")}
        ${list.length > 4 ? `<div class="xs muted" style="padding:0 6px">mais ${list.length - 4}</div>` : ""}</div>`; }).join("")}</div></div></section>`;
    $("#cacc").onchange = (e) => { acc = e.target.value; load(); };
    $$("[data-m]", el).forEach((b) => b.onclick = () => { const m = +b.dataset.m; month = m === 0 ? new Date(now.getFullYear(), now.getMonth(), 1) : new Date(month.getFullYear(), month.getMonth() + m, 1); load(); });
    $$("[data-t]", el).forEach((b) => { b.onclick = () => openTarget(b.dataset.t, load); b.ondragstart = (e) => e.dataTransfer.setData("text/plain", b.dataset.t); });
    $$("[data-day]", el).forEach((c) => {
      if (c.dataset.past === "true") return;
      c.ondragover = (e) => { e.preventDefault(); c.classList.add("over"); };
      c.ondragleave = () => c.classList.remove("over");
      c.ondrop = async (e) => {
        e.preventDefault(); c.classList.remove("over");
        const it = items.find((x) => x.id === e.dataTransfer.getData("text/plain")); if (!it) return;
        const old = new Date(it.scheduledAt), [y, m, dd] = c.dataset.day.split("-").map(Number), nx = new Date(y, m - 1, dd, old.getHours(), old.getMinutes());
        if (dayKey(nx) === dayKey(old)) return;
        try { await api(`/targets/${it.id}`, { method: "PATCH", body: { action: "reschedule", scheduledAt: nx.toISOString() } }); await load(); }
        catch (x) { $("#calmsg").innerHTML = notice("bad", esc(x.message)); }
      };
    });
  };
  await load(); every(20000, () => { if (!$("#drawer-root .drawer")) load(); });
};

PAGES["/posts"] = async (el, q) => {
  const TABS = [["upcoming", "Próximas", "scheduled,queued,paused", "asc"], ["processing", "Em processamento", "queued,processing", "asc"], ["published", "Publicadas", "published", "desc"], ["failed", "Com erro", "failed", "desc"], ["all", "Todas", "", "desc"]];
  let tab = TABS.some((x) => x[0] === q?.get("tab")) ? q.get("tab") : "upcoming", acc = "", term = "";
  const accs = (await api("/accounts")).accounts;
  el.innerHTML = head("Publicações", "Fila, processamento e histórico de todas as contas. Clique numa linha para pausar, editar, reagendar ou ver as tentativas.")
    + `<div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:16px"><div class="tabs" role="tablist">${TABS.map(([id, l]) => `<button role="tab" data-tab="${id}" class="${id === tab ? "on" : ""}" aria-selected="${id === tab}">${l}</button>`).join("")}</div><div class="filters"><input id="pq" type="search" class="field search" placeholder="Buscar legenda ou @conta" aria-label="Buscar publicações"><select id="pacc" class="field" style="width:auto" aria-label="Filtrar conta"><option value="">Todas as contas</option>${accs.map((a) => `<option value="${esc(a.id)}">@${esc(a.username)}</option>`).join("")}</select></div></div><section class="panel" id="plist"><p class="pad muted">Carregando…</p></section>`;
  const load = async () => {
    const t = TABS.find((x) => x[0] === tab), qs = new URLSearchParams({ order: t[3], limit: "200" });
    if (t[2]) qs.set("status", t[2]); if (acc) qs.set("accountId", acc);
    const all = (await api(`/targets?${qs}`)).items, nt = norm(term.trim().replace(/^@/, ""));
    const items = nt ? all.filter((i) => norm(`${i.caption || ""} ${i.username}`).includes(nt)) : all;
    $("#plist").innerHTML = !items.length ? emptyBox("Nada por aqui", nt ? `Nenhuma publicação com “${term.trim()}” neste filtro.` : tab === "failed" ? "Nenhuma publicação falhou." : "Nenhuma publicação neste filtro.")
      : `<div class="scroll-x"><table style="min-width:760px"><thead><tr><th style="padding-left:20px">Conteúdo</th><th>Conta</th><th>Horário</th><th>Situação</th></tr></thead><tbody>${items.map((i) => `<tr class="click" tabindex="0" data-t="${esc(i.id)}">
        <td style="padding-left:20px"><div class="row">${thumb(i.thumb, 40)}<div style="min-width:0"><div style="font-weight:500">${TYPE[i.type]}${i.mediaCount > 1 ? `<span class="muted">, ${i.mediaCount} itens</span>` : ""}</div><div class="muted trunc" style="max-width:38ch">${esc(i.caption || "Sem legenda")}</div></div></div></td>
        <td><span class="row" style="gap:8px">${avatar(i.avatar, i.username, 22)}@${esc(i.username)}</span></td>
        <td><div class="tnum">${fDT(i.publishedAt || i.scheduledAt)}</div><div class="xs muted">${fRel(i.publishedAt || i.scheduledAt)}</div></td>
        <td>${badge(i.status, i.status === "processing")}${i.lastError ? `<div class="xs bad trunc" style="max-width:32ch;margin-top:4px" title="${esc(i.lastError)}">${esc(i.lastError)}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
    $$("[data-t]", el).forEach((r) => { r.onclick = () => openTarget(r.dataset.t, load); r.onkeydown = (e) => e.key === "Enter" && openTarget(r.dataset.t, load); });
  };
  $$("[data-tab]", el).forEach((b) => b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, "", "#/posts?tab=" + tab); $$("[data-tab]", el).forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); }); load(); });
  let qT = null; $("#pq").oninput = (e) => { term = e.target.value; clearTimeout(qT); qT = setTimeout(load, 250); };
  $("#pacc").onchange = (e) => { acc = e.target.value; load(); };
  await load(); every(60000, () => { if (["upcoming", "processing"].includes(tab)) load(); });
};

        <div class="row" style="padding:16px;border-bottom:1px solid rgb(var(--line))"><input id="nq" class="field" placeholder="Nome da fila, por exemplo Dicas da semana" aria-label="Nome da nova fila"><button class="btn" id="cq">Criar fila</button></div>

          <p class="small muted" style="margin:4px 0 0">${DAYS.filter(([d]) => r.daysOfWeek.includes(d)).map(([, l]) => l).join(", ")} às <span class="tnum">${esc(r.times.join(", "))}</span>, da fila ${esc(qd.queues.find((x) => x.id === r.queueId)?.name || "?")}, em ${r.accountIds.map((a) => "@" + esc(un(a))).join(", ")}.${r.recycle ? " Recomeça a fila quando acabar." : ""}</p></li>`).join("")}</ul>` : emptyBox("Nenhuma regra", "Uma regra diz: publicar da fila X, nas contas Y, nestes dias e horários.")}</section></div>`;
    el.insertAdjacentHTML("beforeend", `<section class="panel" style="margin-top:24px"><header><h2>Modelos de legenda e hashtags</h2><button class="btn sm primary" id="ntpl">Novo modelo</button></header>

        : emptyBox("Nenhum modelo", "Salve legendas e blocos de hashtags que você usa sempre. Eles aparecem no Agendar e no Em massa para inserir com um clique.")}</section>`);
    $("#ntpl").onclick = () => templateDrawer({}, ad.accounts, load);

    $("#cq").onclick = async () => { const n = $("#nq").value.trim(); if (!n) return; if (n.toLowerCase() === DRAFTS_NAME.toLowerCase()) return alert('O nome "Rascunhos" é reservado para os rascunhos do Agendar. Escolha outro.'); await api("/queues", { method: "POST", body: { name: n } }); load(); };
    $("#nq").onkeydown = (e) => e.key === "Enter" && $("#cq").click();

function queueDrawer(id, onChange) {
  const render = async (body) => {
    const d = await api(`/queues/${id}`);
    $("#drawer-root h2").textContent = d.queue.name;
    body.innerHTML = `<div class="row" style="gap:8px;margin-bottom:16px"><a class="btn sm primary" href="#/compose">Adicionar conteúdo</a><button class="btn sm danger" id="dq">Excluir fila</button></div>
      ${d.items.length ? `<ol style="display:grid;gap:8px">${d.items.map((it, i) => `<li class="row panel" style="padding:8px;${it.consumedAt ? "opacity:.5" : ""}"><span class="tnum small muted" style="width:24px;text-align:center">${i + 1}</span>${thumb(it.thumb, 40)}<div style="flex:1;min-width:0"><div class="small" style="font-weight:500">${TYPE[it.type]}${it.consumedAt ? `<span class="muted" style="font-weight:400">, já usado</span>` : ""}</div><div class="small muted trunc">${esc(it.caption || "Sem legenda")}</div></div><button class="btn ghost sm" data-mv="${i}:-1" aria-label="Subir">↑</button><button class="btn ghost sm" data-mv="${i}:1" aria-label="Descer">↓</button><button class="btn ghost sm" data-rp="${esc(it.postId)}">Remover</button></li>`).join("")}</ol>` : `<p class="small muted">Fila vazia.</p>`}`;
    $$("[data-mv]", body).forEach((b) => b.onclick = async () => { const [i, dd] = b.dataset.mv.split(":").map(Number), j = i + dd, order = d.items.map((x) => x.postId); if (j < 0 || j >= order.length) return; [order[i], order[j]] = [order[j], order[i]]; await api(`/queues/${id}`, { method: "PATCH", body: { order } }); render(body); });
    $$("[data-rp]", body).forEach((b) => b.onclick = async () => { await api(`/posts/${b.dataset.rp}`, { method: "DELETE" }); render(body); onChange(); });
    $("#dq", body).onclick = async () => { if (!confirm("Excluir esta fila? As regras ligadas a ela também serão excluídas.")) return; await api(`/queues/${id}`, { method: "DELETE" }); closeDrawer(); onChange(); };
  };
  openDrawer("Fila", `<p class="muted">Carregando…</p>`, (body) => render(body).catch((e) => body.innerHTML = notice("bad", esc(e.message))));
}
function ruleDrawer(rule, queues, accounts, onSaved) {
  const r = JSON.parse(JSON.stringify(rule));
  const render = (body) => {
    body.innerHTML = `<div class="stack">
      <div><label class="lb" for="rn">Nome</label><input id="rn" class="field" value="${esc(r.name || "")}" placeholder="Dicas de manhã"></div>
      <div><label class="lb" for="rq">Fila</label><select id="rq" class="field"><option value="">Escolha</option>${queues.map((x) => `<option value="${esc(x.id)}" ${r.queueId === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
      <fieldset style="border:0;padding:0;margin:0"><legend class="lb">Contas</legend><div class="row" style="flex-wrap:wrap;gap:8px">${accounts.map((a) => `<button type="button" class="opt ${r.accountIds.includes(a.id) ? "on" : ""}" style="border-radius:999px;padding:4px 12px" data-ra="${esc(a.id)}" aria-pressed="${r.accountIds.includes(a.id)}">@${esc(a.username)}</button>`).join("")}</div></fieldset>
      <fieldset style="border:0;padding:0;margin:0"><legend class="lb">Dias</legend><div class="row" style="flex-wrap:wrap;gap:6px">${DAYS.map(([d, l]) => `<button type="button" class="opt ${r.daysOfWeek.includes(d) ? "on" : ""}" style="width:48px;padding:6px 0" data-rd="${d}" aria-pressed="${r.daysOfWeek.includes(d)}">${l}</button>`).join("")}</div></fieldset>
      <div><label class="lb" for="rt">Horários</label><input id="rt" class="field tnum" value="${esc(r.times.join(", "))}" placeholder="09:00, 18:30"></div>
      <div class="row" style="gap:12px;align-items:flex-start"><div style="flex:1"><label class="lb" for="rz">Fuso</label><input id="rz" class="field" value="${esc(r.timezone)}"></div><div style="flex:1"><label class="lb" for="rh">Planejar com antecedência</label><select id="rh" class="field">${[3, 7, 14, 30].map((n) => `<option value="${n}" ${r.horizonDays === n ? "selected" : ""}>${n} dias</option>`).join("")}</select></div></div>
      <label class="row small" style="gap:8px;align-items:flex-start"><input type="checkbox" id="rr" ${r.recycle ? "checked" : ""} style="margin-top:4px"><span>Recomeçar a fila quando acabar<span class="muted" style="display:block">Para conteúdo que pode ser republicado. Sem isso, a regra para e avisa no painel quando a fila esvazia.</span></span></label>
      <div id="rmsg"></div><button class="btn primary" id="rs">Salvar regra</button></div>`;
    const keep = () => { r.name = $("#rn", body).value; r.queueId = $("#rq", body).value; r.times = $("#rt", body).value.split(/[,\s]+/).filter(Boolean); r.timezone = $("#rz", body).value; r.horizonDays = +$("#rh", body).value; r.recycle = $("#rr", body).checked; };
    $$("[data-ra]", body).forEach((b) => b.onclick = () => { keep(); const id = b.dataset.ra; r.accountIds = r.accountIds.includes(id) ? r.accountIds.filter((x) => x !== id) : [...r.accountIds, id]; render(body); });
    $$("[data-rd]", body).forEach((b) => b.onclick = () => { keep(); const d = +b.dataset.rd; r.daysOfWeek = r.daysOfWeek.includes(d) ? r.daysOfWeek.filter((x) => x !== d) : [...r.daysOfWeek, d]; render(body); });
    $("#rs", body).onclick = async (e) => {
      keep(); busy(e.target, true);
      const b = { name: r.name, queueId: r.queueId, accountIds: r.accountIds, daysOfWeek: r.daysOfWeek, times: r.times, timezone: r.timezone, recycle: r.recycle, horizonDays: r.horizonDays, active: r.active };
      try { await api(r.id ? `/rules/${r.id}` : "/rules", { method: r.id ? "PATCH" : "POST", body: b }); closeDrawer(); onSaved(); }
      catch (x) { $("#rmsg", body).innerHTML = notice("bad", esc(x.message)); busy(e.target, false); }
    };
  };

async function renderMfaArea() {
  const area = $("#mfaarea"); if (!area) return;
  const factors = await sb.auth.mfa.listFactors().catch(() => ({ data: null }));
  const verified = factors.data?.totp?.find((f) => f.status === "verified");
  if (verified) {
    area.innerHTML = `${notice("ok", "A verificação em duas etapas está <strong>ativa</strong>. No próximo login, além da senha, será pedido o código do app autenticador.")}
      <button class="btn danger" id="mfaoff" style="margin-top:16px">Desativar</button><div id="mfamsg2" style="margin-top:12px"></div>`;
    $("#mfaoff").onclick = async () => {
      if (!confirm("Desativar a verificação em duas etapas? Sua conta fica protegida só pela senha.")) return;
      const b = $("#mfaoff"); busy(b, true);
      // limpa também fatores iniciados e não verificados, que travariam uma nova ativação
      for (const f of [...(factors.data?.totp || []), ...(factors.data?.phone || [])]) await sb.auth.mfa.unenroll({ factorId: f.id }).catch(() => {});
      await sb.auth.refreshSession();
      renderMfaArea();
    };
    return;
  }
  area.innerHTML = `<p style="margin-top:0">Proteja o painel com um segundo fator. Além da senha, o login vai pedir um código que muda a cada 30 segundos, gerado por um app autenticador (Google Authenticator, Authy, Microsoft Authenticator).</p>
    <button class="btn primary" id="mfaon">Ativar verificação em duas etapas</button><div id="mfaenroll" style="margin-top:16px"></div>`;
  $("#mfaon").onclick = startEnroll;
}

async function startEnroll() {
  const box = $("#mfaenroll"); if (!box) return;
  const btn = $("#mfaon"); busy(btn, true);
  // remove tentativas antigas não verificadas antes de começar
  const existing = await sb.auth.mfa.listFactors().catch(() => ({ data: null }));
  for (const f of (existing.data?.totp || []).filter((x) => x.status !== "verified")) await sb.auth.mfa.unenroll({ factorId: f.id }).catch(() => {});
  const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "Instaflow " + Date.now() });
  busy(btn, false);
  if (error) { box.innerHTML = notice("bad", esc(error.message)); return; }
  const factorId = data.id, uri = data.totp.uri, secret = data.totp.secret;
  box.innerHTML = `<div class="panel pad stack">
    <p style="margin:0">1. Abra seu app autenticador e escaneie o QR Code:</p>
    <div class="qrbox"><canvas id="qrc"></canvas></div>
    <p class="small muted" style="margin:0">Não consegue escanear? Digite esta chave no app:<br><code style="word-break:break-all;user-select:all">${esc(secret)}</code></p>
    <p style="margin:8px 0 0">2. Digite o código de 6 dígitos que o app mostrar:</p>
    <div class="row" style="gap:8px"><input id="mfaverify" class="field otp" style="font-size:22px;letter-spacing:8px" inputmode="numeric" maxlength="6" placeholder="000000"><button class="btn primary" id="mfaconfirm">Confirmar</button></div>
    <div id="mfaenrollmsg"></div>
    <button class="btn ghost sm" id="mfacancel" style="align-self:flex-start">Cancelar</button>
  </div>`;
  try { if (!window.QRCode) throw 0; await window.QRCode.toCanvas($("#qrc"), uri, { width: 200, margin: 1 }); } catch { const qb = $(".qrbox"); if (qb) qb.outerHTML = `<p class="small muted" style="margin:0">Use a chave abaixo no seu app autenticador.</p>`; }
  const vi = $("#mfaverify"); vi.oninput = () => { vi.value = vi.value.replace(/\D/g, "").slice(0, 6); };
  $("#mfacancel").onclick = async () => { await sb.auth.mfa.unenroll({ factorId }).catch(() => {}); renderMfaArea(); };
  $("#mfaconfirm").onclick = async () => {
    const b = $("#mfaconfirm"); busy(b, true); $("#mfaenrollmsg").innerHTML = "";
    try {
      const ch = await sb.auth.mfa.challenge({ factorId });
      if (ch.error) throw ch.error;
      const v = await sb.auth.mfa.verify({ factorId, challengeId: ch.data.id, code: vi.value });
      if (v.error) throw v.error;
      await sb.auth.refreshSession();
      renderMfaArea();
    } catch (x) {
      $("#mfaenrollmsg").innerHTML = notice("bad", esc(/invalid|incorrect|code/i.test(x.message) ? "Código incorreto. Confira a hora do celular e tente o próximo código." : x.message));
      busy(b, false);
    }
  };
}

    const days  = curve.reduce((s, r) => s + r.days, 0);
    return `
      <div id="curve-wrap">
        <table style="width:100%;border-collapse:collapse;margin-bottom:8px">
          <thead><tr>
            <th style="text-align:left;padding:6px 8px;font-size:12px;color:rgb(var(--muted))">Duração (dias)</th>

              <td style="padding:4px 8px"><input type="number" class="field" style="width:80px" data-ci="${i}" data-field="postsPerDay" min="1" max="50" value="${r.postsPerDay}"></td>
              <td style="padding:4px 8px">${curve.length > 1 ? `<button class="btn sm ghost bad" data-rm="${i}">–</button>` : ""}</td>
            </tr>`).join("")}
          </tbody>
        </table>
        <button id="add-row" class="btn sm">+ Adicionar fase</button>

  };

  const render = () => {
    const now = new Date();
    const startDefault = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const startVal = startDefault.toISOString().slice(0, 10);

    el.innerHTML = head("Aquecimento de conta", "Agende posts em volume crescente para aquecer uma conta gradualmente sem acionar filtros de spam.")
    + `<section class="panel pad" style="max-width:640px">

      <div style="margin-bottom:20px">
        <label class="lb">Conta alvo</label>
        <select id="wm-acc" class="field">
          ${accounts.map((a) => `<option value="${esc(a.id)}">@${esc(a.username)}</option>`).join("")}
        </select>
      </div>

      <div style="margin-bottom:20px">

          ${library.map((m) => `<option value="${esc(m.id)}">${esc(m.fileName)} (${fmtBytes(m.sizeBytes)})</option>`).join("")}
        </select>
        <p class="hint" style="margin-top:4px">O mesmo vídeo é usado em todos os posts — cada um recebe perturbação de fingerprint única automaticamente.</p>
      </div>

      <div style="margin-bottom:20px">
        <label class="lb">Legenda <span class="muted xs">(opcional — spin: {versão A|versão B})</span></label>
        <textarea id="wm-caption" class="field" rows="3" placeholder="Sem legenda"></textarea>
      </div>

      <div style="margin-bottom:20px">
        <label class="lb">Data de início</label>
        <input id="wm-start" type="date" class="field" value="${startVal}" min="${new Date().toISOString().slice(0,10)}">

      <div style="margin-bottom:20px">
        <label class="lb">Horários de publicação</label>
        <input id="wm-times" type="text" class="field" value="09:00,14:00,19:00" placeholder="09:00,14:00,19:00">
        <p class="hint" style="margin-top:4px">Separados por vírgula. Se um dia tiver mais posts que horários, os extras são espaçados automaticamente a cada hora.</p>
      </div>

      <div style="margin-bottom:20px">
        <label class="lb" style="margin-bottom:8px">Curva de aquecimento</label>
        ${renderCurve()}
      </div>

      <div id="wm-msg" style="margin-bottom:12px"></div>
      <button id="wm-go" class="btn primary" style="width:100%">Gerar agendamentos</button>
    </section>`;

    bindCurve();
    bindGo();
  };

  const bindCurve = () => {
    $$("[data-ci]", el).forEach((inp) => inp.onchange = () => {
      const i = +inp.dataset.ci, f = inp.dataset.field;
      curve[i][f] = Math.max(1, +inp.value || 1);
      const wrap = $("#curve-wrap", el);
      const total = curve.reduce((s, r) => s + r.days * r.postsPerDay, 0);
      const days  = curve.reduce((s, r) => s + r.days, 0);
      wrap.querySelector(".muted.xs").innerHTML = `Total: <strong>${total} posts</strong> em <strong>${days} dias</strong>`;

    const addRow = $("#add-row", el);
    if (addRow) addRow.onclick = () => {
      curve.push({ days: 7, postsPerDay: curve[curve.length - 1].postsPerDay + 1 });
      render();
    };
  };

  const bindGo = () => {
    const goBtn = $("#wm-go", el);
    const wmMsg = $("#wm-msg", el);

    goBtn.onclick = async () => {
      const accId    = $("#wm-acc", el).value;
      const mediaId  = $("#wm-media", el).value;
      const caption  = $("#wm-caption", el).value.trim();
      const startStr = $("#wm-start", el).value;
      const timesRaw = $("#wm-times", el).value.split(",").map((t) => t.trim()).filter(Boolean);

      if (!startStr) { wmMsg.innerHTML = notice("bad", "Escolha a data de início."); return; }
      if (!timesRaw.length) { wmMsg.innerHTML = notice("bad", "Adicione pelo menos um horário."); return; }

      // valida horários HH:MM
      const HHMM = /^([01]\d|2[0-3]):[0-5]\d$/;
      if (timesRaw.some((t) => !HHMM.test(t))) { wmMsg.innerHTML = notice("bad", "Horários inválidos. Use o formato HH:MM (ex: 09:00)."); return; }

      // spin
      const spin = (text, idx) => text.replace(/\{([^{}]+)\}/g, (_, inner) => {
        const opts = inner.split("|"); return opts[idx % opts.length];
      });

      // gera lista de timestamps
      const slots = [];
      let postIdx = 0;
      const [sy, sm, sd] = startStr.split("-").map(Number);
      let dayOffset = 0;

      for (const phase of curve) {
        for (let d = 0; d < phase.days; d++) {
          const date = new Date(sy, sm - 1, sd + dayOffset + d);
          // gera horários pra esse dia
          const dayTimes = [...timesRaw];
          // se posts > horários, preenche com intervalos de 1h a partir do último
          while (dayTimes.length < phase.postsPerDay) {
            const last = dayTimes[dayTimes.length - 1];
            const [lh, lm] = last.split(":").map(Number);
            const nextH = lh + 1 >= 24 ? 23 : lh + 1;
            dayTimes.push(`${String(nextH).padStart(2,"0")}:${String(lm).padStart(2,"0")}`);
          }
          for (let p = 0; p < phase.postsPerDay; p++) {
            const [h, m] = dayTimes[p % dayTimes.length].split(":").map(Number);
            const dt = new Date(date.getFullYear(), date.getMonth(), date.getDate(), h, m);
            if (dt > new Date()) slots.push({ at: dt.toISOString(), idx: postIdx++ });
          }
        }
        dayOffset += phase.days;
      }

      if (!slots.length) { wmMsg.innerHTML = notice("bad", "Nenhum horário futuro gerado. Verifique a data de início."); return; }

      busy(goBtn, true);
      wmMsg.innerHTML = notice("ok", `Agendando ${slots.length} posts em ${dayOffset} dias…`);

      let ok = 0, fail = 0;
      for (const slot of slots) {
        try {
          await api("/posts", {
            method: "POST",
            body: {
              type: "reel",
              caption: spin(caption, slot.idx),
              mediaIds: [mediaId],
              mode: "schedule",
              accounts: [{ accountId: accId, times: [slot.at] }],
              options: {},
            },
          });
          ok++;
        } catch (e) {
          fail++;
          console.warn("[warmup]", slot.at, e.message);
        }
        if ((ok + fail) % 5 === 0 || ok + fail === slots.length) {
          wmMsg.innerHTML = notice("ok", `${ok} de ${slots.length} agendados${fail ? ` (${fail} falhas)` : ""}…`);
        }
      }

      if (ok > 0) {
        wmMsg.innerHTML = notice("ok", `✓ ${ok} post(s) agendado(s) ao longo de ${dayOffset} dias.${fail ? ` ${fail} falha(s).` : ""}`);
        goBtn.textContent = "Concluído";
      } else {
        wmMsg.innerHTML = notice("bad", "Todos os agendamentos falharam.");
        busy(goBtn, false);
      }
    };
  };

  render();
};

/* ───── ANALYTICS / INSIGHTS ───── */
PAGES["/insights"] = async (el) => {
  el.innerHTML = head("Métricas", "Desempenho dos posts publicados nos últimos 30 dias.");
  el.innerHTML += `<div id="an-body"><div class="muted small" style="padding:24px 0">Carregando métricas…</div></div>`;

  let data;
  try {
    // chama a função RPC instaflow_private.analytics via Supabase
    const wsId = me?.workspaceId;
    if (!wsId) throw new Error("Workspace não encontrado");
    const { data: { session } } = await sb.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/analytics_for_workspace`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": `Bearer ${session?.access_token}` },
      body: JSON.stringify({ p_workspace_id: wsId, p_days: 30 }),
    });
    // fallback: chama via instaflow-api se RPC não exposta
    if (!resp.ok) throw new Error("rpc");
    data = await resp.json();
  } catch {
    // chama via api que usa service role internamente
    try { data = await api("/analytics"); } catch (e) { el.querySelector("#an-body").innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  }

  const s = data?.summary || {};
  const fmt = (n) => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n || 0);
  const pct = (n) => (+(n || 0)).toFixed(2) + "%";
  const TYPE_LABEL = { image: "Imagem", video: "Vídeo", reel: "Reel", carousel: "Carrossel", story: "Story" };
  const DAYS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

  const byType = data?.by_type || [];
  const byHour = data?.by_hour || [];
  const top    = data?.top_posts || [];

  // monta o heatmap de horários (0-23h)
  const maxReach = Math.max(...byHour.map((h) => h.avg_reach || 0), 1);
  const heatmap = Array.from({ length: 24 }, (_, h) => {
    const hd = byHour.find((x) => +x.hour === h);
    const intensity = hd ? Math.round((hd.avg_reach / maxReach) * 100) : 0;
    return `<div title="${h}h — alcance médio: ${fmt(hd?.avg_reach || 0)}" style="width:100%;height:32px;border-radius:4px;background:rgb(var(--accent));opacity:${Math.max(0.08, intensity / 100)};cursor:default"></div>`;
  });

  el.querySelector("#an-body").innerHTML = `
    <!-- Resumo -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:1.5rem">
      ${[
        ["Posts", fmt(s.total_posts)],
        ["Alcance", fmt(s.total_reach)],
        ["Curtidas", fmt(s.total_likes)],
        ["Comentários", fmt(s.total_comments)],
        ["Salvos", fmt(s.total_saved)],
        ["Eng. médio", pct(s.avg_engagement)],
      ].map(([l, v]) => `<div class="card" style="padding:14px"><div class="muted xs" style="margin-bottom:4px">${l}</div><div style="font-size:22px;font-weight:500">${v}</div></div>`).join("")}
    </div>

    <!-- Por tipo -->
    ${byType.length ? `<div class="card" style="margin-bottom:1rem"><h3 style="font-size:14px;font-weight:500;margin-bottom:12px">Por formato</h3>
      <div class="scroll-x"><table style="min-width:480px;width:100%"><thead><tr><th>Formato</th><th>Posts</th><th>Alcance médio</th><th>Curtidas médias</th><th>Eng. médio</th></tr></thead><tbody>
        ${byType.map((t) => `<tr><td>${TYPE_LABEL[t.type] || t.type}</td><td>${fmt(t.count)}</td><td>${fmt(t.avg_reach)}</td><td>${fmt(t.avg_likes)}</td><td>${pct(t.avg_engagement)}</td></tr>`).join("")}
      </tbody></table></div></div>` : ""}

    <!-- Heatmap de horários -->
    ${byHour.length ? `<div class="card" style="margin-bottom:1rem"><h3 style="font-size:14px;font-weight:500;margin-bottom:12px">Melhor horário para publicar (alcance médio)</h3>
      <div style="display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end">
        ${heatmap.join("")}
      </div>
      <div style="display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:4px">
        ${Array.from({ length: 24 }, (_, h) => `<div class="xs muted tnum" style="text-align:center">${h}</div>`).join("")}
      </div></div>` : ""}

    <!-- Top posts -->
    ${top.length ? `<div class="card"><h3 style="font-size:14px;font-weight:500;margin-bottom:12px">Top 10 posts (por alcance)</h3>
      <div class="scroll-x"><table style="min-width:600px;width:100%"><thead><tr><th>Post</th><th>Conta</th><th>Tipo</th><th>Alcance</th><th>Curtidas</th><th>Eng.</th></tr></thead><tbody>
        ${top.map((p) => `<tr>
          <td style="max-width:200px"><div class="trunc xs" title="${esc(p.caption || '')}">${p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener" class="accentc">${esc((p.caption || "Ver post").slice(0, 50) || "Ver post")}</a>` : esc((p.caption || "—").slice(0, 50))}</div><div class="xs muted">${p.pub_at ? new Date(p.pub_at).toLocaleDateString("pt-BR") : ""}</div></td>
          <td class="xs">@${esc(p.username)}</td>
          <td class="xs">${TYPE_LABEL[p.post_type] || p.post_type}</td>
          <td class="tnum xs">${fmt(p.reach)}</td>
          <td class="tnum xs">${fmt(p.likes)}</td>
          <td class="tnum xs">${pct(p.engagement)}</td>
        </tr>`).join("")}
      </tbody></table></div></div>` : ""}

    ${!byType.length && !top.length ? `<div class="notice" style="margin-top:1rem">As métricas são coletadas automaticamente a cada 6h. Assim que houver posts publicados, os dados aparecem aqui.</div>` : ""}
  `;
};
