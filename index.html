<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instaflow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23000'/><path d='M8 22l7-9 5 5 4-7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{--canvas:0 0 0;--surface:14 14 14;--sunken:22 22 22;--line:38 38 38;--ink:250 250 250;--muted:150 150 150;--accent:255 255 255;--accent-soft:38 38 38;--on-accent:0 0 0;--ok:74 222 128;--warn:250 204 21;--bad:248 113 113;--idle:120 120 120;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:rgb(var(--canvas));color:rgb(var(--ink));font:15px/1.55 'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:rgb(var(--muted))}.small{font-size:13px}.xs{font-size:12px}
.bad{color:rgb(var(--bad))}.okc{color:rgb(var(--ok))}.warnc{color:rgb(var(--warn))}.accentc{color:rgb(var(--accent))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* layout */
.shell{min-height:100vh;display:flex}
aside{width:240px;flex-shrink:0;background:rgb(var(--surface));border-right:1px solid rgb(var(--line));position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:24px 20px;font-weight:800;font-size:17px;letter-spacing:-.03em;text-decoration:none}
.logo{width:28px;height:28px;border-radius:9px;background:rgb(var(--accent));display:grid;place-items:center;color:rgb(var(--on-accent))}
nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:500;font-size:14px;color:rgb(var(--muted))}
nav a:hover{background:rgb(var(--sunken));color:rgb(var(--ink))}
nav a.on{background:rgb(var(--ink));color:rgb(var(--canvas))}
.side-foot{margin-top:auto;border-top:1px solid rgb(var(--line));padding:16px}
main{flex:1;min-width:0;padding:40px 32px}
.wrap{max-width:1180px;margin:0 auto}
@media (max-width:1000px){.shell{display:block}aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid rgb(var(--line))}.brand{padding:16px 20px}nav{flex-direction:row;overflow-x:auto;padding-bottom:12px}nav a{white-space:nowrap}.side-foot{display:none}main{padding:24px 16px}.mob-out{display:inline}}
.mob-out{display:none}
/* componentes */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:700}
.sub{margin:4px 0 0;color:rgb(var(--muted));max-width:62ch}
.panel{background:rgb(var(--surface));border:1px solid rgb(var(--line));border-radius:14px}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid rgb(var(--line))}
.panel>header h2{font-size:15px;margin:0;font-weight:600}
.pad{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font-weight:500;font-size:14px;border:1px solid rgb(var(--line));background:rgb(var(--surface));cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgb(var(--sunken))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:rgb(var(--accent));border-color:transparent;color:rgb(var(--on-accent));font-weight:600}
.btn.primary:hover{background:rgb(var(--accent)/.85)}
.btn.ghost{border-color:transparent;background:none;color:rgb(var(--muted))}
.btn.ghost:hover{background:rgb(var(--sunken));color:rgb(var(--ink))}
.btn.danger{color:rgb(var(--bad));border-color:rgb(var(--bad)/.3)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.field{width:100%;border:1px solid rgb(var(--line));background:rgb(var(--surface));border-radius:8px;padding:8px 12px;font-size:14px}
.field:focus{outline:none;border-color:rgb(var(--accent))}
label.lb{display:block;font-weight:500;font-size:14px;margin-bottom:6px}
.hint{font-size:12px;color:rgb(var(--muted));margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.t-accent{background:rgb(var(--accent)/.1);color:rgb(var(--accent))}.d-accent{background:rgb(var(--accent))}
.t-warn{background:rgb(var(--warn)/.15);color:rgb(var(--warn))}.d-warn{background:rgb(var(--warn))}
.t-ok{background:rgb(var(--ok)/.15);color:rgb(var(--ok))}.d-ok{background:rgb(var(--ok))}
.t-bad{background:rgb(var(--bad)/.15);color:rgb(var(--bad))}.d-bad{background:rgb(var(--bad))}
.t-idle{background:rgb(var(--idle)/.15);color:rgb(var(--idle))}.d-idle{background:rgb(var(--idle))}
.pulse{animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{opacity:.4}}
.notice{border:1px solid rgb(var(--line));border-radius:8px;padding:12px 16px;font-size:14px}
.notice.bad{border-color:rgb(var(--bad)/.4);background:rgb(var(--bad)/.08);color:rgb(var(--bad))}
.notice.ok{border-color:rgb(var(--ok)/.4);background:rgb(var(--ok)/.08);color:rgb(var(--ok))}
.notice.warn{border-color:rgb(var(--warn)/.4);background:rgb(var(--warn)/.08);color:rgb(var(--warn))}
.empty{text-align:center;padding:48px 24px}.empty p{margin:4px auto 0;max-width:46ch}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;background:rgb(var(--accent-soft));color:rgb(var(--accent));display:grid;place-items:center;font-weight:700;font-size:11px}
.thumb{border-radius:6px;object-fit:cover;background:rgb(var(--sunken));flex-shrink:0}
.row{display:flex;align-items:center;gap:12px}
.list>li{border-top:1px solid rgb(var(--line))}.list>li:first-child{border-top:0}
ul,ol{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;background:none;border:0;text-align:left;cursor:pointer}
.item:hover{background:rgb(var(--sunken))}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grid2{display:grid;gap:24px;grid-template-columns:1.4fr 1fr}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:24px;padding:20px;margin-bottom:24px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid rgb(var(--line));border-radius:999px;padding:4px 12px 4px 4px;background:none;cursor:pointer;font-size:14px}
.chip.on,.opt.on{border-color:rgb(var(--ink));background:rgb(var(--ink));color:rgb(var(--canvas))}
.opt{border:1px solid rgb(var(--line));border-radius:8px;padding:8px 14px;background:none;cursor:pointer;font-weight:500;font-size:14px}
.step{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;margin:0 0 16px}
.step span{width:24px;height:24px;border-radius:50%;background:rgb(var(--ink));color:rgb(var(--surface));display:grid;place-items:center;font-size:12px;font-weight:700}
.stack>*+*{margin-top:24px}
.tabs{display:flex;gap:4px;border:1px solid rgb(var(--line));background:rgb(var(--surface));border-radius:8px;padding:4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:500;font-size:14px;color:rgb(var(--muted));cursor:pointer;white-space:nowrap}
.tabs button.on{background:rgb(var(--ink));color:rgb(var(--surface))}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:12px;color:rgb(var(--muted));padding:10px 12px;border-bottom:1px solid rgb(var(--line))}
td{padding:12px;border-top:1px solid rgb(var(--line))}
tr.click{cursor:pointer}tr.click:hover{background:rgb(var(--sunken))}
/* drawer */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.drawer .bg{position:absolute;inset:0;background:rgb(var(--ink)/.3);border:0}
.drawer .box{position:relative;width:100%;max-width:520px;height:100%;background:rgb(var(--surface));display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.drawer .box>header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid rgb(var(--line))}
.drawer .box>header h2{margin:0;font-size:18px}
.drawer .body{flex:1;overflow-y:auto;padding:20px}
/* dia */
.rail{min-width:720px;padding:12px 20px 16px}
.rail-ax{position:relative;height:20px;margin-left:160px;font-size:11px;color:rgb(var(--muted))}
.rail-ax span{position:absolute;transform:translateX(-50%)}
.rail-body{position:relative}
.rail-grid{position:absolute;top:0;bottom:0;left:160px;right:0;pointer-events:none}
.rail-grid i{position:absolute;top:0;bottom:0;width:1px;background:rgb(var(--line))}
.rail-now{position:absolute;top:-6px;bottom:-6px;width:2px;background:rgb(var(--accent));border-radius:2px}
.rail-row{display:flex;align-items:center;height:48px}
.rail-name{width:160px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding-right:12px;font-size:14px}
.rail-track{position:relative;flex:1;height:100%}
.rail-dot{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;border:3px solid rgb(var(--surface));transform:translate(-50%,-50%);cursor:pointer;padding:0;transition:transform .15s}
.rail-dot:hover{transform:translate(-50%,-50%) scale(1.25)}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);min-width:760px}
.cal .wd{padding:8px 12px;font-size:12px;color:rgb(var(--muted));border-bottom:1px solid rgb(var(--line))}
.cal .day{min-height:118px;border-bottom:1px solid rgb(var(--line));border-right:1px solid rgb(var(--line));padding:6px}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:rgb(var(--sunken)/.6)}.cal .day.over{background:rgb(var(--sunken));outline:2px dashed rgb(var(--ink));outline-offset:-2px}
.cal .num{font-size:14px;color:rgb(var(--muted))}
.cal .num.today{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgb(var(--accent));color:rgb(var(--on-accent));font-weight:600}
.cal .ev{display:flex;align-items:center;gap:6px;width:100%;padding:2px 6px;border:0;background:none;border-radius:4px;font-size:12px;text-align:left;cursor:pointer}
.cal .ev:hover{background:rgb(var(--sunken))}
.cal .add{font-size:12px;color:rgb(var(--accent));text-decoration:none;opacity:0}.cal .day:hover .add,.cal .add:focus{opacity:1}
/* auth */
.auth{display:grid;grid-template-columns:1fr 1.1fr;min-height:100vh}
.auth form{width:100%;max-width:360px}
.auth .art{background:rgb(var(--sunken));border-left:1px solid rgb(var(--line));color:rgb(var(--ink));display:flex;flex-direction:column;justify-content:center;gap:20px;padding:0 64px}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth .art{display:none}}
.uploads{display:flex;flex-wrap:wrap;gap:12px}
.up{width:112px}.up .sq{aspect-ratio:1;border-radius:8px;overflow:hidden;background:rgb(var(--sunken));display:grid;place-items:center}
.up .sq img,.up .sq video{width:100%;height:100%;object-fit:cover}
.drop{width:112px;aspect-ratio:1;border:2px dashed rgb(var(--line));border-radius:8px;display:grid;place-items:center;text-align:center;color:rgb(var(--muted));cursor:pointer;font-size:14px}
.drop:hover{border-color:rgb(var(--accent));color:rgb(var(--accent))}
.cards{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgb(var(--line));border-top:1px solid rgb(var(--line));border-bottom:1px solid rgb(var(--line))}
.kv>div{background:rgb(var(--surface));padding:12px 16px}
@media (max-width:600px){.kv{grid-template-columns:1fr 1fr}}
.compose{display:grid;gap:24px;grid-template-columns:1fr 340px}
@media (max-width:1000px){.compose{grid-template-columns:1fr}}
.sticky{position:sticky;top:40px;align-self:start}
.bell{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid rgb(var(--line));background:none;display:grid;place-items:center;cursor:pointer;color:rgb(var(--ink))}
.bell:hover{background:rgb(var(--sunken))}
.bell .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:rgb(var(--bad));color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ig{border:1px solid rgb(var(--line));border-radius:12px;overflow:hidden;background:rgb(var(--canvas))}
.ig-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px}
.ig-m{position:relative;background:rgb(var(--sunken));overflow:hidden}
.ig-m img,.ig-m video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ig-tag{position:absolute;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
.ig-c{padding:10px 12px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.ig-c .hl{color:rgb(120 170 255)}
.ig-c .more{color:rgb(var(--muted));cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";
/* ===================== Configuração (valores públicos do projeto) ===================== */
const SUPABASE_URL = "https://hvicjhsvqzlqekmfsndw.supabase.co";
const SUPABASE_KEY = "sb_publishable_i3NdDr0COW24UyKYn3kEwQ_AoLHkiYQ"; // chave pública; o RLS e a API protegem os dados
const API = SUPABASE_URL + "/functions/v1/instaflow-api";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

/* ===================== Utilitários ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
/** Escape de tudo que vem do banco ou do usuário: nada é inserido como HTML cru. */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const toLocalInput = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fTime = (d) => new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" }).format(new Date(d));
const fDT = (d) => new Intl.DateTimeFormat("pt-BR", { weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(d));
function fRel(d) {
  const diff = new Date(d) - Date.now(), a = Math.abs(diff), r = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
  if (a < 6e4) return diff > 0 ? "em instantes" : "agora";
  if (a < 36e5) return r.format(Math.round(diff / 6e4), "minute");
  if (a < 864e5) return r.format(Math.round(diff / 36e5), "hour");
  return r.format(Math.round(diff / 864e5), "day");
}
const STATUS = {
  draft: ["Rascunho", "idle"], scheduled: ["Agendado", "accent"], queued: ["Na fila", "accent"], processing: ["Publicando", "warn"],
  published: ["Publicado", "ok"], failed: ["Falhou", "bad"], paused: ["Pausado", "idle"], canceled: ["Cancelado", "idle"],
};
const TYPE = { image: "Imagem", video: "Vídeo", carousel: "Carrossel", reel: "Reel", story: "Story" };
const ACC = { active: ["Conectada", "ok"], paused: ["Pausada", "idle"], needs_reconnect: ["Reconectar", "bad"], disconnected: ["Removida", "idle"] };
const badge = (s, pulse) => { const [l, t] = STATUS[s] || [s, "idle"]; return `<span class="badge t-${t}"><span class="dot d-${t} ${pulse ? "pulse" : ""}"></span>${esc(l)}</span>`; };
const avatar = (src, name, size = 32) => src
  ? `<img class="avatar" src="${esc(src)}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`
  : `<span class="avatar" style="width:${size}px;height:${size}px">${esc(String(name || "").slice(0, 2).toUpperCase())}</span>`;
const thumb = (t, s = 44) => !t ? `<span class="thumb" style="width:${s}px;height:${s}px"></span>`
  : t.kind === "video" ? `<video class="thumb" src="${esc(t.url)}" muted preload="metadata" style="width:${s}px;height:${s}px"></video>`
  : `<img class="thumb" src="${esc(t.url)}" alt="" style="width:${s}px;height:${s}px">`;
const keepKey = "instaflow.keep";
const keepPref = () => localStorageGet(keepKey) === "1";
const fmtBytes = (n) => n >= 1e9 ? (n / 1e9).toFixed(2).replace(".", ",") + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(n / 1e3)) + " KB";
function videoDuration(file) {
  return new Promise((ok) => {
    const v = document.createElement("video"), url = URL.createObjectURL(file);
    v.preload = "metadata"; v.muted = true;
    v.onloadedmetadata = () => { URL.revokeObjectURL(url); ok(v.duration); };
    v.onerror = () => { URL.revokeObjectURL(url); ok(NaN); };
    v.src = url;
  });
}
/** Limpa metadados de um vídeo e confere a duração permitida pelo formato. */
async function prepareVideo(file, type) {
  const dur = await videoDuration(file), [min, max] = type === "story" ? [3, 60] : [3, 900];
  if (Number.isFinite(dur) && (dur < min || dur > max)) throw new Error(`${type === "story" ? "Story" : "Reel"} precisa ter de ${min} s a ${max >= 900 ? "15 min" : max + " s"} (este tem ${Math.round(dur)} s).`);
  if (file.size > 50 * 1024 * 1024) throw new Error(`Vídeo de ${fmtBytes(file.size)}: acima do limite de 50 MB do bucket.`);
  const rv = stripMp4(new Uint8Array(await file.arrayBuffer()));
  return { file: new File(rv.parts, file.name, { type: file.type || "video/mp4" }), note: rv.removed.length ? `Metadados removidos: ${rv.removed.join(", ")}` : "Sem metadados para remover" };
}
const keepBox = (id, on) => `<label class="row small" style="gap:8px;margin-top:12px;align-items:flex-start"><input type="checkbox" id="${id}" ${on ? "checked" : ""} style="margin-top:4px"><span>Guardar na biblioteca para repostar<span class="muted" style="display:block">Sem marcar, o arquivo é apagado do armazenamento 24 h depois que todas as contas publicarem.</span></span></label>`;
const notice = (tone, html) => `<div class="notice ${tone}">${html}</div>`;
const emptyBox = (title, text, action = "") => `<div class="empty"><strong>${esc(title)}</strong>${text ? `<p class="muted small">${esc(text)}</p>` : ""}${action ? `<div style="margin-top:16px">${action}</div>` : ""}</div>`;
function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.l = btn.innerHTML; btn.innerHTML = `<span class="spin"></span>${btn.dataset.l}`; } else if (btn.dataset.l) btn.innerHTML = btn.dataset.l; }

/* ===================== Sessão e API ===================== */
let session = null, me = null;
const wsKey = "instaflow.ws";
async function api(path, { method = "GET", body } = {}) {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (!session) { go("/login"); throw new Error("Faça login para continuar"); }
  const res = await fetch(API + path, {
    method,
    headers: { Authorization: "Bearer " + session.access_token, "Content-Type": "application/json", ...(localStorageGet(wsKey) ? { "X-Workspace-Id": localStorageGet(wsKey) } : {}) },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { await sb.auth.signOut(); go("/login"); }

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }

/* ===================== Roteador ===================== */
let timers = [];
const every = (ms, fn) => timers.push(setInterval(() => { if (document.visibilityState === "visible") fn(); }, ms));
function go(path) { if (location.hash !== "#" + path) location.hash = "#" + path; else route(); }
function parseHash() { const h = location.hash.slice(1) || "/dashboard"; const [p, q] = h.split("?"); return { path: p, q: new URLSearchParams(q || "") }; }
const PUBLIC = ["/login", "/register", "/forgot"];
const inviteKey = "instaflow.invite";
const ROLE_PT = { owner: "dono", admin: "editor", member: "só visualizar" };
let flashMsg = "";
const PAGES = {};

async function route() {
  timers.forEach(clearInterval); timers = [];
  closeDrawer();
  const { path, q } = parseHash();
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (path === "/invite" && q.get("token")) {
    localStorageSet(inviteKey, q.get("token"));
    if (!session) return go("/register");
  }
  if (!session && !PUBLIC.includes(path)) return go("/login");
  if (session && PUBLIC.includes(path)) return go("/dashboard");
  if (!session) return authPage(path.slice(1));
  if (localStorageGet(inviteKey)) {
    const token = localStorageGet(inviteKey);
    localStorageSet(inviteKey, null);
    try { const r = await api("/invites/accept", { method: "POST", body: { token } }); localStorageSet(wsKey, r.workspaceId); me = null; $("#app").dataset.shell = ""; flashMsg = notice("ok", `Você entrou no workspace <strong>${esc(r.workspace)}</strong> como ${esc(ROLE_PT[r.role])}.`); }
    catch (e) { flashMsg = notice("bad", `Convite: ${esc(e.message)}`); }
    if (path === "/invite") return go("/dashboard");
  }
  if (!me) {
    try { me = await api("/me"); if (!localStorageGet(wsKey)) localStorageSet(wsKey, me.workspaceId); }
    catch (e) { $("#app").innerHTML = `<div class="pad">${notice("bad", esc(e.message))}</div>`; return; }
  }
  const page = PAGES[path] || PAGES["/dashboard"];
  shell(path);
  try {
    await page($("#main"), q);
    if (flashMsg) { $("#main").insertAdjacentHTML("afterbegin", `<div style="margin-bottom:20px">${flashMsg}</div>`); flashMsg = ""; }
  }
  catch (e) { $("#main").innerHTML = notice("bad", esc(e.message)); }
}

const OUTCOME = { success: "Concluída", retry: "Vai tentar de novo", failed: "Falhou", deferred: "Adiada pelo limite diário" };
function openTarget(id, onChanged) {
  let caption = null;
  const render = async (body) => {
    const d = await api(`/targets/${id}`);

      <div class="row" style="flex-wrap:wrap;gap:8px">${badge(s, s === "processing")}<span class="small muted">${TYPE[d.post.type]}</span><span class="small muted tnum">${fDT(t.scheduledAt)}</span></div>
      ${t.lastError ? notice(s === "failed" ? "bad" : "warn", esc(t.lastError)) : ""}

      <div class="row" style="flex-wrap:wrap;gap:8px">
        ${["scheduled", "queued"].includes(s) ? `<button class="btn sm" data-act="pause">Pausar</button>` : ""}
        ${s === "paused" ? `<button class="btn sm" data-act="resume">Retomar</button>` : ""}
        ${["scheduled", "paused"].includes(s) ? `<button class="btn sm" data-act="publish_now">Publicar agora</button>` : ""}
        ${["failed", "canceled"].includes(s) ? `<button class="btn sm primary" data-act="retry">Tentar de novo</button>` : ""}

    </div>`;
    const msg = (tone, t) => $("#tmsg", body).innerHTML = notice(tone, esc(t));
    $$("[data-act]", body).forEach((b) => b.onclick = async () => { busy(b, true); try { await api(`/targets/${id}`, { method: "PATCH", body: { action: b.dataset.act } }); onChanged && onChanged(); await render(body); } catch (e) { msg("bad", e.message); busy(b, false); } });

    const rs = $("[data-resched]", body); if (rs) rs.onclick = async () => { busy(rs, true); try { await api(`/targets/${id}`, { method: "PATCH", body: { action: "reschedule", scheduledAt: new Date($("#when", body).value).toISOString() } }); onChanged && onChanged(); await render(body); } catch (e) { msg("bad", e.message); busy(rs, false); } };

  };

}

function dayRail(accounts, items, start) {

    <div class="rail-body"><div class="rail-grid">${H.map((h) => `<i style="left:${h / 24 * 100}%"></i>`).join("")}<span class="rail-now" style="left:${pct(new Date())}%"></span></div>
    ${accounts.map((a) => `<div class="rail-row"><div class="rail-name">${avatar(a.avatar, a.username, 24)}<span class="trunc ${a.status === "active" ? "" : "muted"}">@${esc(a.username)}</span></div><div class="rail-track">${items.filter((i) => i.accountId === a.id && i.status !== "canceled").map((i) => `<button class="rail-dot d-${STATUS[i.status][1]} ${i.status === "processing" ? "pulse" : ""}" data-t="${esc(i.id)}" style="left:${pct(i.scheduledAt)}%" title="${fTime(i.scheduledAt)}, ${STATUS[i.status][0]}, ${TYPE[i.type]}"><span class="sr">${fTime(i.scheduledAt)} ${STATUS[i.status][0]}</span></button>`).join("")}</div></div>`).join("")}
    </div>${items.length ? "" : `<p class="small muted" style="margin:4px 0 0 160px">Nenhuma publicação hoje.</p>`}</div></div>`;
}

      + `<div id="aflash" style="margin-bottom:20px">${flash}</div>`

      + (d.accounts.length ? `<div class="cards">${d.accounts.map((a) => {
        const [l, t] = ACC[a.status] || [a.status, "idle"];

          <div class="kv small">${[["Na fila", a.inQueue], ["Erros (30d)", a.failed30d], ["Última", a.lastPublishedAt ? fRel(a.lastPublishedAt) : "Nenhuma"], ["Próxima", a.nextScheduledAt ? fDT(a.nextScheduledAt) : "Nada agendado"]].map(([k, v]) => `<div><div class="xs muted">${k}</div><div class="tnum" style="font-weight:500">${esc(v)}</div></div>`).join("")}</div>
          ${a.lastError || soon ? `<div class="small" style="padding:16px 20px 0">${a.lastError ? `<p class="bad" style="margin:0">${esc(a.lastError)}</p>` : ""}${soon && a.status !== "needs_reconnect" ? `<p class="warnc" style="margin:0">A autorização vence ${fRel(a.tokenExpiresAt)}. A renovação é automática; se falhar, reconecte.</p>` : ""}</div>` : ""}
          <div class="row pad" style="flex-wrap:wrap;gap:8px">
            ${a.status === "needs_reconnect" ? `<button class="btn sm primary" data-connect="${esc(a.id)}">Reconectar</button>` : `<button class="btn sm" data-toggle="${esc(a.id)}" data-on="${a.status === "active"}">${a.status === "active" ? "Pausar conta" : "Ativar conta"}</button>`}
            <button class="btn sm" data-check="${esc(a.id)}">Testar conexão</button>
            <button class="btn sm ghost" data-cfg="${esc(a.id)}">Configurações</button>
            <button class="btn sm ghost bad" style="margin-left:auto" data-rm="${esc(a.id)}">Remover</button>
          </div></article>`;

    const flashMsg = (tone, t) => $("#aflash").innerHTML = notice(tone, esc(t));
    $$("[data-connect]", el).forEach((b) => b.onclick = async () => { busy(b, true); try { const r = await api("/accounts/connect", { method: "POST", body: { reconnect: b.dataset.connect || undefined, returnTo: location.origin + location.pathname } }); location.href = r.url; } catch (e) { flashMsg("bad", e.message); busy(b, false); } });
    $$("[data-toggle]", el).forEach((b) => b.onclick = async () => { busy(b, true); try { await api(`/accounts/${b.dataset.toggle}`, { method: "PATCH", body: { active: b.dataset.on !== "true" } }); await load(); } catch (e) { flashMsg("bad", e.message); busy(b, false); } });
    $$("[data-check]", el).forEach((b) => b.onclick = async () => { busy(b, true); const r = await api(`/accounts/${b.dataset.check}/check`, { method: "POST" }).catch((e) => ({ ok: false, error: e.message })); await load(); flashMsg(r.ok ? "ok" : "bad", r.ok ? `A conta respondeu. Cota da API: ${r.quota.used} de ${r.quota.total} publicações nas últimas 24h.` : r.error); });
    $$("[data-rm]", el).forEach((b) => b.onclick = async () => { const a = d.accounts.find((x) => x.id === b.dataset.rm); if (!confirm(`Remover @${a.username}? Os agendamentos pendentes serão cancelados. O histórico fica guardado.`)) return; await api(`/accounts/${a.id}`, { method: "DELETE" }); load(); });
    $$("[data-cfg]", el).forEach((b) => b.onclick = () => accountSettings(d.accounts.find((x) => x.id === b.dataset.cfg), load));
  };
  await load(); every(30000, load);
  if (q.get("connected") || q.get("error")) history.replaceState(null, "", "#/accounts");
};
function accountSettings(a, onSaved) {

    <div><label class="lb" for="tz">Fuso horário</label><input id="tz" class="field" value="${esc(a.timezone)}"><p class="hint">Usado nas regras de automação desta conta.</p></div>

const NOTE = { image: "Uma imagem JPEG no feed.", video: "Publicado como Reel compartilhado no feed. A API oficial não publica mais vídeo de feed separado.", carousel: "De 2 a 10 itens, imagens e vídeos misturados.", reel: "Um vídeo MP4 ou MOV, de 3 s a 15 min. Proporção 9:16 recomendada.", story: "Uma imagem ou vídeo. A API não aceita legenda, stickers, links nem enquetes em stories." };
const IMG_ACCEPT = "image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif";
const ACCEPT = { image: IMG_ACCEPT, video: "video/mp4,video/quicktime", reel: "video/mp4,video/quicktime", story: IMG_ACCEPT + ",video/mp4,video/quicktime", carousel: IMG_ACCEPT + ",video/mp4,video/quicktime" };

PAGES["/compose"] = async (el, q) => {
  const [ad, qd] = await Promise.all([api("/accounts"), api("/queues")]);

  const first = q.get("date") ? new Date(q.get("date") + "T09:00") : new Date(Date.now() + 36e5); first.setSeconds(0, 0);
  const S = { keep: keepPref(), sel: [], type: "image", ups: [], caption: "", dates: [toLocalInput(first)], repeat: "none", count: 4, perAcc: false, accTimes: {}, dest: "schedule", queueId: "",
    opts: { collab: "", tags: [], reelTags: "", cover: "auto", thumbSec: 0, coverMediaId: null, coverPreview: null, locationId: "" }, capOpen: false };
  let templates = (await api("/templates").catch(() => ({ templates: [] }))).templates;

  let reuseMsg = "";
  if (q.get("reuse")) {
    try {
      const pd = await api(`/posts/${encodeURIComponent(q.get("reuse"))}`);
      const ok = pd.media.filter((m) => m.available);
      S.type = pd.type; S.caption = pd.caption || "";
      const po = pd.options || {};
      S.opts.collab = (po.collaborators || []).join(", ");
      if (pd.type === "image") S.opts.tags = po.userTags || []; else S.opts.reelTags = (po.userTags || []).map((t) => t.username).join(", ");
      S.opts.locationId = po.locationId || "";
      if (pd.cover) Object.assign(S.opts, { cover: "image", coverMediaId: pd.cover.id, coverPreview: pd.cover.previewUrl });
      else if (typeof po.thumbOffsetMs === "number") Object.assign(S.opts, { cover: "frame", thumbSec: po.thumbOffsetMs / 1000 });
      S.ups = ok.map((m) => ({ name: m.fileName, kind: m.kind, mediaId: m.id, preview: m.previewUrl, note: m.keep ? "Da biblioteca" : "Reaproveitada", progress: 100 }));
      reuseMsg = ok.length < pd.media.length ? notice("warn", "Parte da mídia deste post já foi apagada pela limpeza automática. Envie o arquivo de novo.") : notice("ok", "Conteúdo carregado para publicar de novo. Escolha as contas e o horário.");
    } catch (e) { reuseMsg = notice("bad", esc(e.message)); }
  } else if (q.get("media")) {
    const ids = q.get("media").split(","), lib = (await api("/library?all=1")).items.filter((m) => ids.includes(m.id));
    S.ups = ids.map((id) => lib.find((m) => m.id === id)).filter(Boolean).map((m) => ({ name: m.fileName, kind: m.kind, mediaId: m.id, preview: m.previewUrl, note: "Da biblioteca", progress: 100 }));

      ${S.type !== "story" ? step(4, "Legenda", `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px"><select id="tplsel" class="field" style="width:auto;max-width:260px" aria-label="Modelo de legenda"><option value="">Modelos de legenda…</option>${tplOptions(templates, S.sel)}</select><button class="btn sm" id="tplins">Inserir</button><button class="btn sm ghost" id="tplsave">Salvar legenda como modelo</button></div><textarea id="cap" class="field" rows="6" placeholder="Escreva a legenda">${esc(S.caption)}</textarea><div class="row xs muted tnum" style="justify-content:flex-end;gap:16px;margin-top:4px"><span id="tagc" class="${tags > 30 ? "bad" : ""}">${tags}/30 hashtags</span><span id="capc" class="${S.caption.length > 2200 ? "bad" : ""}">${S.caption.length}/2200</span></div>`) : ""}
      ${S.type !== "story" ? advStep() : ""}

  const isReel = () => S.type === "reel" || S.type === "video";
  const splitUsers = (txt) => [...new Set(txt.split(/[\s,;]+/).map((u) => u.replace(/^@/, "").trim().toLowerCase()).filter(Boolean))];

  /** Opções extras no formato que a API espera (só o que vale para o formato escolhido). */

  function previewHead() {

    } catch (e) { $("#cmsg", el).innerHTML = notice("bad", esc(e.message)); busy(btn, false); submitting = false; }
  }

};

const ascii = (u8, from, n) => String.fromCharCode(...u8.subarray(from, from + n));

function exifOrientation(seg) {
  // seg = FFE1 len "Exif\0\0" TIFF...
  const t = 10, le = seg[t] === 0x49;
  const dv = new DataView(seg.buffer, seg.byteOffset, seg.byteLength);
  const u16 = (o) => dv.getUint16(t + o, le), u32 = (o) => dv.getUint32(t + o, le);
  try {
    const ifd = u32(4), n = u16(ifd);
    for (let k = 0; k < n; k++) { const e = ifd + 2 + k * 12; if (u16(e) === 0x0112) return u16(e + 8); }
  } catch { /* EXIF malformado */ }

}

/** JPEG: remove EXIF (GPS, câmera, datas), XMP, IPTC, miniaturas e comentários. Mantém JFIF, perfil de cor ICC e Adobe (cor). */
function stripJpeg(u8) {
  if (u8[0] !== 0xff || u8[1] !== 0xd8) throw new Error("JPEG inválido");
  const parts = [u8.subarray(0, 2)], removed = new Set();
  let i = 2, orientation = 1;
  while (i < u8.length) {
    if (u8[i] !== 0xff) throw new Error("JPEG inválido");
    const m = u8[i + 1];
    if (m === 0xff) { i++; continue; }
    if (m === 0xda || m === 0xd9) { parts.push(u8.subarray(i)); break; }          // imagem comprimida: copiada intacta
    if ((m >= 0xd0 && m <= 0xd7) || m === 0x01) { parts.push(u8.subarray(i, i + 2)); i += 2; continue; }

    else if (m === 0xe0) { keep = ascii(seg, 4, 5) === "JFIF\0"; if (!keep) removed.add("miniatura"); }
    else if (m === 0xe2) { keep = ascii(seg, 4, 12) === "ICC_PROFILE\0"; if (!keep) removed.add("dados de fabricante"); }
    else if (m === 0xee) keep = ascii(seg, 4, 5) === "Adobe";
    else if (m === 0xed) { keep = false; removed.add("IPTC"); }
    else if (m >= 0xe3 && m <= 0xef) { keep = false; removed.add("dados de fabricante"); }
    else if (m === 0xfe) { keep = false; removed.add("comentário"); }
    if (keep) parts.push(seg);
    i += 2 + len;

/** MP4/MOV: remove udta/meta/XMP (GPS, aparelho, software, autor), zera datas de criação e corrige os offsets das amostras. */
function stripMp4(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

    const out = [];
    let p = start;
    while (p + 8 <= end) {
      let size = dv.getUint32(p), hdr = 8;
      const type = ascii(u8, p + 4, 4);
      if (size === 1) { size = Number(dv.getBigUint64(p + 8)); hdr = 16; }
      else if (size === 0) size = end - p;
      if (size < hdr || p + size > end) throw new Error("Vídeo com estrutura inválida");
      out.push({ type, start: p, end: p + size, hdr });
      p += size;
    }
    return out;
  };
  const CONTAINERS = new Set(["moov", "trak", "mdia", "minf", "stbl", "edts"]);
  const DROP_TOP = new Set(["udta", "meta", "uuid"]);
  const DROP_IN = new Set(["udta", "meta", "uuid"]);
  const top = readBoxes(0, u8.length);
  if (!top.length || !["ftyp", "moov", "mdat", "free", "wide", "skip"].includes(top[0].type)) throw new Error("Não parece um MP4/MOV");

  const ranges = [], removed = new Set();
  const markDrops = (box) => {
    for (const c of readBoxes(box.start + box.hdr, box.end)) {
      if (DROP_IN.has(c.type)) { ranges.push([c.start, c.end]); removed.add(c.type === "uuid" ? "XMP" : "metadados (GPS, aparelho, software)"); }
      else if (CONTAINERS.has(c.type)) markDrops(c);
    }
  };
  for (const b of top) {
    if (DROP_TOP.has(b.type)) { ranges.push([b.start, b.end]); removed.add(b.type === "uuid" ? "XMP" : "metadados (GPS, aparelho, software)"); }
    else if (b.type === "moov") markDrops(b);
  }
  const shift = (off) => { let d = 0; for (const [s, e] of ranges) if (e <= off) d += e - s; return off - d; };

  const be32 = (n) => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n); return b; };
  const build = (box) => {   // reconstrói um contêiner sem os filhos removidos
    const kids = [];
    for (const c of readBoxes(box.start + box.hdr, box.end)) {
      if (DROP_IN.has(c.type)) continue;
      if (CONTAINERS.has(c.type)) { kids.push(build(c)); continue; }
      const raw = u8.slice(c.start, c.end), v = new DataView(raw.buffer);
      if (c.type === "stco") { const n = v.getUint32(12); for (let k = 0; k < n; k++) v.setUint32(16 + k * 4, shift(v.getUint32(16 + k * 4))); }

      else if (c.type === "mvhd" || c.type === "tkhd" || c.type === "mdhd") {
        if (raw[8] === 1) { v.setBigUint64(12, 0n); v.setBigUint64(20, 0n); } else { v.setUint32(12, 0); v.setUint32(16, 0); }
        if (!removed.has("datas de gravação")) removed.add("datas de gravação");
      }
      kids.push(raw);
    }
    const size = 8 + kids.reduce((n, k) => n + k.length, 0), out = new Uint8Array(size);
    out.set(be32(size), 0); out.set(u8.subarray(box.start + 4, box.start + 8), 4);
    let o = 8; for (const k of kids) { out.set(k, o); o += k.length; }
    return out;
  };
  const parts = [];
  for (const b of top) {
    if (DROP_TOP.has(b.type)) continue;
    parts.push(b.type === "moov" ? build(b) : u8.subarray(b.start, b.end));  // mdat (o vídeo em si) é copiado intacto
  }
  return { parts, removed: [...removed] };
}

/* ---------- Preparo da imagem no navegador ----------
   O Instagram só aceita JPEG e, no feed, proporção entre 4:5 e 1,91:1.
   Aqui convertemos (PNG, WebP, HEIC), corrigimos a orientação, recortamos no centro
   quando a proporção não é aceita e limitamos a 1440 px e 8 MB. */
const FEED_MIN = 0.8, FEED_MAX = 1.91, MAX_W = 1440, MAX_IMG = 8 * 1024 * 1024;

function loadHeic() {
  heicLoader ??= new Promise((ok, ko) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
    sc.onload = ok; sc.onerror = () => { heicLoader = null; ko(new Error("Não foi possível carregar o conversor de HEIC. Tente exportar a foto como JPEG.")); };
    document.head.appendChild(sc);
  });

}
async function prepareImage(file, type) {
  let src = file;
  if (isHeic(file)) {
    await loadHeic();
    src = await window.heic2any({ blob: file, toType: "image/jpeg", quality: 0.95 });
    if (Array.isArray(src)) src = src[0];
  }
  let bmp;
  try { bmp = await createImageBitmap(src, { imageOrientation: "from-image" }); }
  catch { throw new Error("Não foi possível ler esta imagem. Use JPEG, PNG ou HEIC."); }
  const w = bmp.width, h = bmp.height, r = w / h, feed = type === "image" || type === "carousel";
  let cw = w, ch = h, note = "";
  if (feed && r < FEED_MIN) { ch = Math.round(w / FEED_MIN); note = "Recortada para 4:5, a proporção vertical máxima do feed"; }
  else if (feed && r > FEED_MAX) { cw = Math.round(h * FEED_MAX); note = "Recortada para 1,91:1, a proporção horizontal máxima do feed"; }
  const scale = Math.min(1, MAX_W / cw), ratio = cw / ch;
  const untouched = src === file && file.type === "image/jpeg" && cw === w && ch === h && scale === 1 && file.size <= MAX_IMG;
  let rotated = false;
  if (untouched) {
    const r0 = stripJpeg(new Uint8Array(await file.arrayBuffer()));
    if (r0.orientation === 1) {
      bmp.close();
      const clean = new File(r0.parts, file.name, { type: "image/jpeg" });
      return { file: clean, ratio, note: r0.removed.length ? `Metadados removidos: ${r0.removed.join(", ")}` : "Sem metadados para remover" };
    }
    rotated = true; // a rotação estava só no EXIF: aplicamos de verdade nos pixels
  }
  const cv = document.createElement("canvas");
  cv.width = Math.round(cw * scale); cv.height = Math.round(ch * scale);
  const cx = cv.getContext("2d");
  cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); // PNG transparente vira fundo branco
  cx.drawImage(bmp, (w - cw) / 2, (h - ch) / 2, cw, ch, 0, 0, cv.width, cv.height);
  bmp.close();
  let q = 0.92, blob;
  do { blob = await new Promise((res) => cv.toBlob(res, "image/jpeg", q)); q -= 0.1; } while (blob.size > MAX_IMG && q > 0.45);
  if (!note) note = rotated ? "Girada para a posição correta" : file.type !== "image/jpeg" || src !== file ? "Convertida para JPEG" : scale < 1 ? "Reduzida para 1440 px de largura" : "Comprimida para caber em 8 MB";
  note += ". Metadados removidos (o arquivo é gerado do zero)";
  return { file: new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }), ratio, note };
}
function putFile(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest(); x.open("PUT", url);
    x.setRequestHeader("Content-Type", file.type); x.setRequestHeader("x-upsert", "false");
    x.upload.onprogress = (e) => e.lengthComputable && onProgress(Math.round(e.loaded / e.total * 99));
    x.onload = () => x.status < 300 ? resolve() : reject(new Error(`Upload recusado pelo storage (${x.status})`));
    x.onerror = () => reject(new Error("Falha de rede no upload"));
    x.send(file);
  });
}

  function bind() {
    $$("[data-acc]", el).forEach((b) => b.onclick = () => { const id = b.dataset.acc; S.sel = S.sel.includes(id) ? S.sel.filter((x) => x !== id) : [...S.sel, id]; if (S.sel.includes(id)) loadBusy(id); render(); });
    $$("[data-type]", el).forEach((b) => b.onclick = () => { S.type = b.dataset.type; render(); });
    $$("[data-day]", el).forEach((b) => b.onclick = () => { const d = +b.dataset.day; S.days = S.days.includes(d) ? S.days.filter((x) => x !== d) : [...S.days, d]; render(); });
    $("#bstart", el).onchange = (e) => { S.start = e.target.value || dayKey(new Date()); render(); };
    $("#btimes", el).onchange = (e) => { S.times = e.target.value; render(); };
    $("#bskip", el).onchange = (e) => { S.skipBusy = e.target.checked; render(); };
    const cap = $("#bcap", el); if (cap) cap.oninput = (e) => { S.caption = e.target.value; };
    const bt = $("#btplins", el); if (bt) bt.onclick = () => { const t = templates.find((x) => x.id === $("#btpl", el).value); if (!t) return; S.caption = S.caption.trim() ? S.caption.replace(/\s+$/, "") + "\n\n" + t.body : t.body; render(); };
    $$("[data-cap]", el).forEach((t) => t.oninput = (e) => { S.items[+t.dataset.cap].caption = e.target.value; });
    $$("[data-rm]", el).forEach((b) => b.onclick = () => { S.items.splice(+b.dataset.rm, 1); render(); });
    $$("[data-mv]", el).forEach((b) => b.onclick = () => { const [i, d] = b.dataset.mv.split(":").map(Number), j = i + d; if (j < 0 || j >= S.items.length) return; [S.items[i], S.items[j]] = [S.items[j], S.items[i]]; render(); });
    const bk = $("#bkeep", el); if (bk) bk.onchange = (e) => { S.keep = e.target.checked; localStorageSet(keepKey, S.keep ? "1" : null); };
    $("[data-lib]", el).onclick = () => pickFromLibrary();
    const clr = $("[data-clear]", el); if (clr) clr.onclick = () => { if (confirm("Remover todas as fotos desta lista?")) { S.items = []; render(); } };
    $("#bfile", el).onchange = (e) => { const f = [...e.target.files]; e.target.value = ""; handleFiles(f); };
    const drop = $("#bdrop", el);
    drop.ondragover = (e) => { e.preventDefault(); drop.style.borderColor = "rgb(var(--ink))"; };
    drop.ondragleave = () => { drop.style.borderColor = ""; };
    drop.ondrop = (e) => { e.preventDefault(); drop.style.borderColor = ""; handleFiles(e.dataTransfer.files); };
    $("#bsubmit", el).onclick = submit;
  }

  /** Recebe os arquivos escolhidos ou arrastados: ajusta o formato quando dá e nunca ignora nada em silêncio. */
  function handleFiles(list) {
    const files = [...list];
    if (!files.length) return;
    S.flash = "";
    const isVid = (f) => f.type.startsWith("video") || /\.(mp4|mov)$/i.test(f.name);
    const vids = files.filter(isVid).length, imgs = files.length - vids;
    if (!S.items.length) {
      if (vids && !imgs && S.type === "image") S.type = "reel";
      else if (imgs && !vids && S.type === "reel") S.type = "image";
    }
    const ok = files.filter(fits), skipped = files.length - ok.length;
    if (skipped) S.flash = `${skipped} arquivo(s) ignorado(s): o formato ${S.type === "reel" ? "Reel aceita só vídeos (MP4 ou MOV)" : S.type === "image" ? "Imagem no feed aceita só fotos (JPEG, PNG ou HEIC)" : "Story aceita fotos e vídeos MP4/MOV"}. ${vids && imgs ? "Para misturar fotos e vídeos no mesmo lote, use o formato Story, ou faça um lote para cada tipo." : ""}`;
    if (!ok.length) { render(); return; }
    addFiles(ok);
  }

  /** Prepara (limpa metadados, converte, recorta) e envia, 3 por vez. */
  async function addFiles(files) {
    const room = BULK_MAX - S.items.length;
    if (files.length > room) S.flash = `Só cabem mais ${room} item(ns) neste lote (máximo ${BULK_MAX}); os demais foram ignorados.`;
    const fresh = files.slice(0, Math.max(0, room)).map((f) => ({ file: f, name: f.name, kind: f.type.startsWith("video") ? "video" : "image", caption: "", state: "Na fila" }));
    S.items.push(...fresh); render();
    let next = 0;
    const worker = async () => {
      while (next < fresh.length) {
        const it = fresh[next++];
        if (!S.items.includes(it)) continue;
        try {
          it.state = "Limpando e preparando…"; render();
          const pr = it.kind === "video" ? await prepareVideo(it.file, S.type) : await prepareImage(it.file, S.type);
          it.note = pr.note; it.ratio = pr.ratio; it.state = "Enviando…"; render();
          const r = await api("/media", { method: "POST", body: { fileName: pr.file.name, mimeType: pr.file.type, sizeBytes: pr.file.size, keep: S.keep } });
          await putFile(r.uploadUrl, pr.file, () => { });
          const c = await api(`/media/${r.mediaId}/complete`, { method: "POST" });
          Object.assign(it, { mediaId: r.mediaId, preview: c.previewUrl, state: "" });
          delete it.file;
        } catch (e) { it.error = e.message; }
        render();
      }
    };
    await Promise.all([worker(), worker(), worker()]);
  }

  async function pickFromLibrary() {
    const lib = (await api("/library")).items.filter((m) => S.type === "reel" ? m.kind === "video" : S.type === "image" ? m.kind === "image" : true);
    const chosen = new Set();
    openDrawer("Adicionar da biblioteca", lib.length ? `<p class="small muted" style="margin-top:0">Só aparece o que foi guardado e combina com o formato ${S.type === "reel" ? "Reel" : S.type === "story" ? "Story" : "Imagem"}.</p>
      <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${lib.map((m) => `<label class="panel" style="padding:8px;cursor:pointer"><input type="checkbox" data-pick="${esc(m.id)}"> ${m.kind === "video" ? `<video src="${esc(m.previewUrl || "")}" muted preload="metadata" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px"></video>` : `<img src="${esc(m.previewUrl || "")}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px">`}<div class="xs trunc">${esc(m.fileName)}</div><div class="xs muted">Publicada ${m.published}x</div></label>`).join("")}</div>
      <button class="btn primary" id="pickok" style="margin-top:16px;width:100%">Adicionar selecionadas</button>`
      : emptyBox("Nada guardado para este formato", "Marque \"Guardar na biblioteca\" ao enviar, ou guarde mídias na página Biblioteca."), (body) => {
      $$("[data-pick]", body).forEach((c) => c.onchange = () => { c.checked ? chosen.add(c.dataset.pick) : chosen.delete(c.dataset.pick); $("#pickok", body).textContent = `Adicionar ${chosen.size || ""} selecionada(s)`; });
      const okb = $("#pickok", body); if (okb) okb.onclick = () => {
        const room = BULK_MAX - S.items.length;
        S.items.push(...lib.filter((m) => chosen.has(m.id)).slice(0, room).map((m) => ({ name: m.fileName, kind: m.kind, mediaId: m.id, preview: m.previewUrl, caption: "", note: "Da biblioteca" })));
        closeDrawer(); render();
      };
    });
  }

  async function submit() {
    if (S.sending) return;
    const { ready, per } = plan();
    if (!confirm(`Agendar ${ready.length * S.sel.length} publicação(ões) em ${S.sel.length} conta(s)?`)) return;
    const results = [];
    for (const [i, it] of ready.entries()) {
      S.sending = `${i + 1} de ${ready.length}`; render();
      try {
        await api("/posts", { method: "POST", body: {
          type: S.type, caption: S.type === "story" ? "" : (it.caption.trim() || S.caption), mediaIds: [it.mediaId], mode: "schedule",
          accounts: S.sel.map((id) => ({ accountId: id, times: [per[id][i].toISOString()] })),
        } });
        results.push({ it, ok: true, when: S.sel.map((id) => per[id][i]) });
      } catch (e) { results.push({ it, ok: false, error: e.message }); }
    }
    S.sending = false; S.done = results; render();
  }

  function renderDone() {
    const ok = S.done.filter((r) => r.ok), bad = S.done.filter((r) => !r.ok);
    el.innerHTML = head("Lote agendado") + `<section class="panel pad stack">
      <p style="font-size:17px;margin:0"><strong>${ok.length * S.sel.length}</strong> publicação(ões) agendada(s) a partir de ${ok.length} foto(s).</p>
      ${ok.length ? `<p class="small muted" style="margin:0">Primeira: ${fDT(new Date(Math.min(...ok.flatMap((r) => r.when.map(Number)))))}. Última: ${fDT(new Date(Math.max(...ok.flatMap((r) => r.when.map(Number)))))}.</p>` : ""}
      ${bad.length ? notice("bad", `${bad.length} foto(s) não foram agendadas:<br>${bad.map((r) => `${esc(r.it.name)}: ${esc(r.error)}`).join("<br>")}`) : ""}
      <div class="row" style="gap:8px"><a class="btn primary" href="#/calendar">Ver no calendário</a><a class="btn" href="#/bulk" onclick="setTimeout(route)">Novo lote</a></div></section>`;
  }

  render();
};

PAGES["/calendar"] = async (el) => {
  const now = new Date(); let month = new Date(now.getFullYear(), now.getMonth(), 1), acc = "", items = [];
  const accs = (await api("/accounts")).accounts;
  const load = async () => {
    const gs = new Date(month); gs.setDate(1 - ((gs.getDay() + 6) % 7));
    const days = Array.from({ length: 42 }, (_, i) => { const d = new Date(gs); d.setDate(d.getDate() + i); return d; });
    const end = new Date(gs); end.setDate(end.getDate() + 42);
    const qs = new URLSearchParams({ from: gs.toISOString(), to: end.toISOString(), limit: "500" }); if (acc) qs.set("accountId", acc);
    items = (await api(`/targets?${qs}`)).items.filter((i) => i.status !== "canceled");
    const by = {}; items.forEach((i) => (by[dayKey(new Date(i.scheduledAt))] ||= []).push(i));
    const today = dayKey(new Date());
    el.innerHTML = head("Calendário", "Arraste um post para outro dia para reagendar no mesmo horário. Clique em Agendar num dia para criar nele.", `<select id="cacc" class="field" style="width:auto" aria-label="Filtrar conta"><option value="">Todas as contas</option>${accs.map((a) => `<option value="${esc(a.id)}" ${acc === a.id ? "selected" : ""}>@${esc(a.username)}</option>`).join("")}</select><a class="btn primary" href="#/compose">Agendar publicação</a>`)
      + `<div id="calmsg" style="margin-bottom:16px"></div><section class="panel" style="overflow:hidden"><header><h2 style="text-transform:capitalize;font-size:18px">${new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric" }).format(month)}</h2><div class="row" style="gap:4px"><button class="btn ghost sm" data-m="-1">Anterior</button><button class="btn ghost sm" data-m="0">Hoje</button><button class="btn ghost sm" data-m="1">Próximo</button></div></header>
      <div class="scroll-x"><div class="cal">${["seg", "ter", "qua", "qui", "sex", "sáb", "dom"].map((w) => `<div class="wd">${w}</div>`).join("")}
      ${days.map((d) => { const k = dayKey(d), list = (by[k] || []).sort((a, b) => new Date(a.scheduledAt) - new Date(b.scheduledAt)), past = k < today;
        return `<div class="day ${d.getMonth() !== month.getMonth() ? "out" : ""}" data-day="${k}" data-past="${past}"><div class="row" style="justify-content:space-between;padding:0 4px 4px"><span class="num tnum ${k === today ? "today" : ""}">${d.getDate()}</span>${past ? "" : `<a class="add" href="#/compose?date=${k}">Agendar</a>`}</div>
        ${list.slice(0, 4).map((i) => { const dr = ["scheduled", "paused", "failed"].includes(i.status); return `<button class="ev" data-t="${esc(i.id)}" ${dr ? `draggable="true" style="cursor:grab"` : ""}><span class="dot d-${STATUS[i.status][1]}"></span><span class="tnum muted">${fTime(i.scheduledAt)}</span><span class="trunc">@${esc(i.username)}</span><span class="sr">${TYPE[i.type]}, ${STATUS[i.status][0]}</span></button>`; }).join("")}
        ${list.length > 4 ? `<div class="xs muted" style="padding:0 6px">mais ${list.length - 4}</div>` : ""}</div>`; }).join("")}</div></div></section>`;
    $("#cacc").onchange = (e) => { acc = e.target.value; load(); };
    $$("[data-m]", el).forEach((b) => b.onclick = () => { const m = +b.dataset.m; month = m === 0 ? new Date(now.getFullYear(), now.getMonth(), 1) : new Date(month.getFullYear(), month.getMonth() + m, 1); load(); });
    $$("[data-t]", el).forEach((b) => { b.onclick = () => openTarget(b.dataset.t, load); b.ondragstart = (e) => e.dataTransfer.setData("text/plain", b.dataset.t); });
    $$("[data-day]", el).forEach((c) => {
      if (c.dataset.past === "true") return;
      c.ondragover = (e) => { e.preventDefault(); c.classList.add("over"); };
      c.ondragleave = () => c.classList.remove("over");
      c.ondrop = async (e) => {
        e.preventDefault(); c.classList.remove("over");
        const it = items.find((x) => x.id === e.dataTransfer.getData("text/plain")); if (!it) return;
        const old = new Date(it.scheduledAt), [y, m, dd] = c.dataset.day.split("-").map(Number), nx = new Date(y, m - 1, dd, old.getHours(), old.getMinutes());
        if (dayKey(nx) === dayKey(old)) return;
        try { await api(`/targets/${it.id}`, { method: "PATCH", body: { action: "reschedule", scheduledAt: nx.toISOString() } }); await load(); }
        catch (x) { $("#calmsg").innerHTML = notice("bad", esc(x.message)); }
      };
    });
  };
  await load(); every(20000, () => { if (!$("#drawer-root .drawer")) load(); });
};

        <div class="row" style="padding:16px;border-bottom:1px solid rgb(var(--line))"><input id="nq" class="field" placeholder="Nome da fila, por exemplo Dicas da semana" aria-label="Nome da nova fila"><button class="btn" id="cq">Criar fila</button></div>
        ${qd.queues.length ? `<ul class="list">${qd.queues.map((x) => `<li><button class="item" data-q="${esc(x.id)}" style="justify-content:space-between"><strong style="font-weight:500">${esc(x.name)}</strong><span class="small muted tnum">${x.remaining} na espera, ${x.total} no total</span></button></li>`).join("")}</ul>` : emptyBox("Nenhuma fila", "Crie uma fila e adicione conteúdos em Agendar, escolhendo \"Adicionar a uma fila de conteúdo\".")}</section>
      <section class="panel"><header><h2>Regras</h2><button class="btn primary sm" id="nr" ${qd.queues.length ? "" : "disabled"}>Nova regra</button></header>
        ${rd.rules.length ? `<ul class="list">${rd.rules.map((r) => `<li style="padding:16px 20px"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div class="row" style="gap:8px"><strong>${esc(r.name)}</strong><span class="badge t-${r.active ? "ok" : "idle"}"><span class="dot d-${r.active ? "ok" : "idle"}"></span>${r.active ? "Ativa" : "Pausada"}</span></div><div class="row" style="gap:4px"><button class="btn ghost sm" data-rt="${esc(r.id)}">${r.active ? "Pausar" : "Ativar"}</button><button class="btn ghost sm" data-re="${esc(r.id)}">Editar</button><button class="btn ghost sm bad" data-rd="${esc(r.id)}">Excluir</button></div></div>
          <p class="small muted" style="margin:4px 0 0">${DAYS.filter(([d]) => r.daysOfWeek.includes(d)).map(([, l]) => l).join(", ")} às <span class="tnum">${esc(r.times.join(", "))}</span>, da fila ${esc(qd.queues.find((x) => x.id === r.queueId)?.name || "?")}, em ${r.accountIds.map((a) => "@" + esc(un(a))).join(", ")}.${r.recycle ? " Recomeça a fila quando acabar." : ""}</p></li>`).join("")}</ul>` : emptyBox("Nenhuma regra", "Uma regra diz: publicar da fila X, nas contas Y, nestes dias e horários.")}</section></div>`;
    el.insertAdjacentHTML("beforeend", `<section class="panel" style="margin-top:24px"><header><h2>Modelos de legenda e hashtags</h2><button class="btn sm primary" id="ntpl">Novo modelo</button></header>
      ${td.templates.length ? `<ul class="list">${td.templates.map((t) => `<li><button class="item" data-tpl="${esc(t.id)}"><div style="flex:1;min-width:0"><strong style="font-weight:500">${esc(t.name)}</strong> <span class="xs muted">${t.accountId ? "@" + esc(un(t.accountId)) : "todas as contas"}</span><div class="small muted trunc">${esc(t.body)}</div></div></button></li>`).join("")}</ul>`
        : emptyBox("Nenhum modelo", "Salve legendas e blocos de hashtags que você usa sempre. Eles aparecem no Agendar e no Em massa para inserir com um clique.")}</section>`);
    $("#ntpl").onclick = () => templateDrawer({}, ad.accounts, load);
    $$("[data-tpl]", el).forEach((b) => b.onclick = () => templateDrawer(td.templates.find((t) => t.id === b.dataset.tpl), ad.accounts, load));
    $("#cq").onclick = async () => { const n = $("#nq").value.trim(); if (!n) return; await api("/queues", { method: "POST", body: { name: n } }); load(); };
    $("#nq").onkeydown = (e) => e.key === "Enter" && $("#cq").click();
    $$("[data-q]", el).forEach((b) => b.onclick = () => queueDrawer(b.dataset.q, load));
    $("#nr").onclick = () => ruleDrawer({ daysOfWeek: [1, 2, 3, 4, 5], times: ["09:00"], timezone: "America/Sao_Paulo", horizonDays: 7, recycle: false, active: true, accountIds: [] }, qd.queues, ad.accounts, load);
    $$("[data-re]", el).forEach((b) => b.onclick = () => ruleDrawer(rd.rules.find((r) => r.id === b.dataset.re), qd.queues, ad.accounts, load));
    $$("[data-rt]", el).forEach((b) => b.onclick = async () => { const r = rd.rules.find((x) => x.id === b.dataset.rt); await api(`/rules/${r.id}`, { method: "PATCH", body: { active: !r.active } }); load(); });
    $$("[data-rd]", el).forEach((b) => b.onclick = async () => { const r = rd.rules.find((x) => x.id === b.dataset.rd); if (!confirm(`Excluir a regra "${r.name}"? Os horários futuros criados por ela serão cancelados.`)) return; await api(`/rules/${r.id}`, { method: "DELETE" }); load(); });
  };
  await load();
};
function queueDrawer(id, onChange) {
  const render = async (body) => {
    const d = await api(`/queues/${id}`);
    $("#drawer-root h2").textContent = d.queue.name;
    body.innerHTML = `<div class="row" style="gap:8px;margin-bottom:16px"><a class="btn sm primary" href="#/compose">Adicionar conteúdo</a><button class="btn sm danger" id="dq">Excluir fila</button></div>
      ${d.items.length ? `<ol style="display:grid;gap:8px">${d.items.map((it, i) => `<li class="row panel" style="padding:8px;${it.consumedAt ? "opacity:.5" : ""}"><span class="tnum small muted" style="width:24px;text-align:center">${i + 1}</span>${thumb(it.thumb, 40)}<div style="flex:1;min-width:0"><div class="small" style="font-weight:500">${TYPE[it.type]}${it.consumedAt ? `<span class="muted" style="font-weight:400">, já usado</span>` : ""}</div><div class="small muted trunc">${esc(it.caption || "Sem legenda")}</div></div><button class="btn ghost sm" data-mv="${i}:-1" aria-label="Subir">↑</button><button class="btn ghost sm" data-mv="${i}:1" aria-label="Descer">↓</button><button class="btn ghost sm" data-rp="${esc(it.postId)}">Remover</button></li>`).join("")}</ol>` : `<p class="small muted">Fila vazia.</p>`}`;
    $$("[data-mv]", body).forEach((b) => b.onclick = async () => { const [i, dd] = b.dataset.mv.split(":").map(Number), j = i + dd, order = d.items.map((x) => x.postId); if (j < 0 || j >= order.length) return; [order[i], order[j]] = [order[j], order[i]]; await api(`/queues/${id}`, { method: "PATCH", body: { order } }); render(body); });
    $$("[data-rp]", body).forEach((b) => b.onclick = async () => { await api(`/posts/${b.dataset.rp}`, { method: "DELETE" }); render(body); onChange(); });
    $("#dq", body).onclick = async () => { if (!confirm("Excluir esta fila? As regras ligadas a ela também serão excluídas.")) return; await api(`/queues/${id}`, { method: "DELETE" }); closeDrawer(); onChange(); };
  };
  openDrawer("Fila", `<p class="muted">Carregando…</p>`, (body) => render(body).catch((e) => body.innerHTML = notice("bad", esc(e.message))));
}
function ruleDrawer(rule, queues, accounts, onSaved) {
  const r = JSON.parse(JSON.stringify(rule));
  const render = (body) => {
    body.innerHTML = `<div class="stack">
      <div><label class="lb" for="rn">Nome</label><input id="rn" class="field" value="${esc(r.name || "")}" placeholder="Dicas de manhã"></div>
      <div><label class="lb" for="rq">Fila</label><select id="rq" class="field"><option value="">Escolha</option>${queues.map((x) => `<option value="${esc(x.id)}" ${r.queueId === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
      <fieldset style="border:0;padding:0;margin:0"><legend class="lb">Contas</legend><div class="row" style="flex-wrap:wrap;gap:8px">${accounts.map((a) => `<button type="button" class="opt ${r.accountIds.includes(a.id) ? "on" : ""}" style="border-radius:999px;padding:4px 12px" data-ra="${esc(a.id)}" aria-pressed="${r.accountIds.includes(a.id)}">@${esc(a.username)}</button>`).join("")}</div></fieldset>
      <fieldset style="border:0;padding:0;margin:0"><legend class="lb">Dias</legend><div class="row" style="flex-wrap:wrap;gap:6px">${DAYS.map(([d, l]) => `<button type="button" class="opt ${r.daysOfWeek.includes(d) ? "on" : ""}" style="width:48px;padding:6px 0" data-rd="${d}" aria-pressed="${r.daysOfWeek.includes(d)}">${l}</button>`).join("")}</div></fieldset>
      <div><label class="lb" for="rt">Horários</label><input id="rt" class="field tnum" value="${esc(r.times.join(", "))}" placeholder="09:00, 18:30"></div>
      <div class="row" style="gap:12px;align-items:flex-start"><div style="flex:1"><label class="lb" for="rz">Fuso</label><input id="rz" class="field" value="${esc(r.timezone)}"></div><div style="flex:1"><label class="lb" for="rh">Planejar com antecedência</label><select id="rh" class="field">${[3, 7, 14, 30].map((n) => `<option value="${n}" ${r.horizonDays === n ? "selected" : ""}>${n} dias</option>`).join("")}</select></div></div>
      <label class="row small" style="gap:8px;align-items:flex-start"><input type="checkbox" id="rr" ${r.recycle ? "checked" : ""} style="margin-top:4px"><span>Recomeçar a fila quando acabar<span class="muted" style="display:block">Para conteúdo que pode ser republicado. Sem isso, a regra para e avisa no painel quando a fila esvazia.</span></span></label>
      <div id="rmsg"></div><button class="btn primary" id="rs">Salvar regra</button></div>`;
    const keep = () => { r.name = $("#rn", body).value; r.queueId = $("#rq", body).value; r.times = $("#rt", body).value.split(/[,\s]+/).filter(Boolean); r.timezone = $("#rz", body).value; r.horizonDays = +$("#rh", body).value; r.recycle = $("#rr", body).checked; };
    $$("[data-ra]", body).forEach((b) => b.onclick = () => { keep(); const id = b.dataset.ra; r.accountIds = r.accountIds.includes(id) ? r.accountIds.filter((x) => x !== id) : [...r.accountIds, id]; render(body); });
    $$("[data-rd]", body).forEach((b) => b.onclick = () => { keep(); const d = +b.dataset.rd; r.daysOfWeek = r.daysOfWeek.includes(d) ? r.daysOfWeek.filter((x) => x !== d) : [...r.daysOfWeek, d]; render(body); });
    $("#rs", body).onclick = async (e) => {
      keep(); busy(e.target, true);
      const b = { name: r.name, queueId: r.queueId, accountIds: r.accountIds, daysOfWeek: r.daysOfWeek, times: r.times, timezone: r.timezone, recycle: r.recycle, horizonDays: r.horizonDays, active: r.active };
      try { await api(r.id ? `/rules/${r.id}` : "/rules", { method: r.id ? "PATCH" : "POST", body: b }); closeDrawer(); onSaved(); }
      catch (x) { $("#rmsg", body).innerHTML = notice("bad", esc(x.message)); busy(e.target, false); }
    };
  };
  openDrawer(r.id ? "Editar regra" : "Nova regra", "", render);
}


/* ===================== Proxy ===================== */
PAGES["/proxy"] = async (el) => {
  const load = async () => {
    const d = await api("/accounts");
    const withProxy = d.accounts.filter((a) => a.proxy).length;
    el.innerHTML = head("Proxy", "Proxy de saída por conta: as chamadas daquela conta à API oficial da Meta passam por esse endereço de rede.")
      + `<div style="margin-bottom:20px">${notice("", `Use para infraestrutura legítima, como sair por um IP fixo liberado no firewall da empresa ou por uma rede corporativa. O proxy <strong>não</strong> muda limites, regras nem a forma como a Meta identifica a conta: a autorização é pelo token oficial. O endereço fica guardado criptografado e só o servidor e o host aparecem aqui.`)}</div>`
      + `<div id="pmsg2" style="margin-bottom:16px"></div>`
      + `<section class="panel"><header><h2>Contas</h2><span class="small muted tnum">${withProxy} de ${d.accounts.length} com proxy</span></header>`
      + (d.accounts.length ? `<ul class="list">${d.accounts.map((a) => `<li style="padding:16px 20px">
          <div class="row" style="flex-wrap:wrap;gap:12px">
            ${avatar(a.profilePictureUrl, a.username, 36)}
            <div style="flex:1;min-width:180px"><strong>@${esc(a.username)}</strong>
              <div class="small ${a.proxy ? "" : "muted"} tnum">${a.proxy ? `Proxy: ${esc(a.proxy)}` : "Conexão direta, sem proxy"}</div></div>
            <div class="row" style="gap:8px;flex-wrap:wrap">
              <button class="btn sm" data-ptest="${esc(a.id)}">Testar conexão</button>
              ${a.proxy ? `<button class="btn sm ghost bad" data-prm="${esc(a.id)}">Remover proxy</button>` : ""}
            </div>
          </div>
          <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap">
            <input class="field" style="flex:1;min-width:240px" data-pin="${esc(a.id)}" autocomplete="off" spellcheck="false" placeholder="${a.proxy ? "Novo endereço para substituir" : "http://usuario:senha@host:porta ou socks5://host:porta"}" aria-label="Proxy de @${esc(a.username)}">
            <button class="btn sm primary" data-psave="${esc(a.id)}">${a.proxy ? "Trocar" : "Salvar"}</button>
          </div>
          <div class="small" data-pres="${esc(a.id)}" style="margin-top:8px"></div>
        </li>`).join("")}</ul>` : emptyBox("Nenhuma conta conectada", "Conecte uma conta em Contas para configurar o proxy dela.", `<a class="btn sm" href="#/accounts">Ir para Contas</a>`))
      + `</section>`;
    const res = (id, tone, text) => { const x = $(`[data-pres="${id}"]`, el); x.innerHTML = notice(tone, esc(text)); };
    $$("[data-psave]", el).forEach((b) => b.onclick = async () => {
      const id = b.dataset.psave, v = $(`[data-pin="${id}"]`, el).value.trim();
      if (!v) return res(id, "bad", "Digite o endereço do proxy.");
      busy(b, true);
      try { await api(`/accounts/${id}`, { method: "PATCH", body: { proxyUrl: v } }); await load(); res(id, "ok", "Proxy salvo. Clique em Testar conexão para confirmar que a Meta responde por ele."); }
      catch (e) { res(id, "bad", e.message); busy(b, false); }
    });
    $$("[data-prm]", el).forEach((b) => b.onclick = async () => {
      busy(b, true);
      try { await api(`/accounts/${b.dataset.prm}`, { method: "PATCH", body: { proxyUrl: null } }); await load(); res(b.dataset.prm, "ok", "Proxy removido. A conta volta a usar conexão direta."); }
      catch (e) { res(b.dataset.prm, "bad", e.message); busy(b, false); }
    });
    $$("[data-ptest]", el).forEach((b) => b.onclick = async () => {
      const id = b.dataset.ptest; busy(b, true);
      const r = await api(`/accounts/${id}/check`, { method: "POST" }).catch((e) => ({ ok: false, error: e.message }));
      busy(b, false);
      r.ok ? res(id, "ok", `A Meta respondeu${d.accounts.find((a) => a.id === id)?.proxy ? " pelo proxy" : ""}. Cota da API: ${r.quota.used} de ${r.quota.total} publicações nas últimas 24h.`)
           : res(id, "bad", `Falhou: ${r.error}. Se o proxy estiver configurado, remova-o para voltar à conexão direta; com proxy quebrado as publicações dessa conta também falham.`);
    });
  };
  await load();
};


/* ===================== Equipe ===================== */
PAGES["/team"] = async (el) => {
  const ROLE_DESC = { owner: "Dono: tudo, inclusive gerenciar a equipe", admin: "Editor: conecta contas, agenda, edita e convida", member: "Só visualizar: vê tudo, não altera nada" };
  const load = async (lastInvite) => {
    const d = await api("/team");
    const canInvite = d.myRole === "owner" || d.myRole === "admin", isOwner = d.myRole === "owner";
    el.innerHTML = head("Equipe", `Pessoas com acesso ao workspace ${d.workspace || ""}. Todas veem as mesmas contas, filas e publicações.`)
      + `<div id="tmsg" style="margin-bottom:16px">${lastInvite || ""}</div>`
      + `<section class="panel" style="margin-bottom:24px"><header><h2>Membros</h2><span class="small muted tnum">${d.members.length}</span></header><ul class="list">${d.members.map((m) => `
        <li class="row" style="padding:12px 20px;flex-wrap:wrap">
          ${avatar(null, m.name, 32)}
          <div style="flex:1;min-width:180px"><div style="font-weight:500">${esc(m.name)}${m.isYou ? ` <span class="xs muted">(você)</span>` : ""}</div><div class="xs muted">${esc(m.email)}</div></div>
          ${isOwner ? `<select class="field" style="width:auto" data-role="${esc(m.userId)}" aria-label="Papel de ${esc(m.name)}">${["owner", "admin", "member"].map((r) => `<option value="${r}" ${m.role === r ? "selected" : ""}>${ROLE_PT[r][0].toUpperCase() + ROLE_PT[r].slice(1)}</option>`).join("")}</select>` : `<span class="badge t-idle">${esc(ROLE_PT[m.role])}</span>`}
          ${isOwner && !m.isYou ? `<button class="btn ghost sm bad" data-rmm="${esc(m.userId)}">Remover</button>` : ""}
          ${m.isYou && !isOwner ? `<button class="btn ghost sm bad" data-rmm="${esc(m.userId)}" data-self="1">Sair do workspace</button>` : ""}
        </li>`).join("")}</ul></section>`
      + (canInvite ? `<section class="panel" style="margin-bottom:24px"><header><h2>Convidar pessoa</h2></header><div class="pad">
          <form id="invf" class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">
            <div style="flex:2;min-width:220px"><label class="lb" for="ie">E-mail</label><input id="ie" type="email" class="field" required placeholder="pessoa@exemplo.com"></div>
            <div style="flex:1;min-width:160px"><label class="lb" for="ir">Papel</label><select id="ir" class="field"><option value="admin">Editor</option><option value="member">Só visualizar</option></select></div>
            <button class="btn primary">Gerar convite</button>
          </form>
          <p class="hint">O painel gera um link de convite, válido por 7 dias. Envie esse link para a pessoa, por WhatsApp ou e-mail. Ela precisa entrar ou criar a conta com <strong>o mesmo e-mail</strong> do convite.</p>
        </div></section>` : "")
      + (d.invites.length ? `<section class="panel" style="margin-bottom:24px"><header><h2>Convites pendentes</h2></header><ul class="list">${d.invites.map((i) => `<li class="row" style="padding:12px 20px;justify-content:space-between;flex-wrap:wrap"><span><strong style="font-weight:500">${esc(i.email)}</strong> <span class="xs muted">como ${esc(ROLE_PT[i.role])}, vence ${fRel(i.expiresAt)}</span></span><button class="btn ghost sm" data-rmi="${esc(i.id)}">Cancelar</button></li>`).join("")}</ul></section>` : "")
      + `<section class="panel pad"><h2 style="font-size:15px;margin:0 0 8px">O que cada papel pode fazer</h2><ul class="small" style="display:grid;gap:4px">${Object.values(ROLE_DESC).map((t) => `<li>• ${esc(t)}</li>`).join("")}</ul></section>`;
    const msg = (t, h) => $("#tmsg", el).innerHTML = notice(t, h);
    const f = $("#invf", el);
    if (f) f.onsubmit = async (e) => {
      e.preventDefault(); const b = $("button", f); busy(b, true);
      try {
        const r = await api("/team/invites", { method: "POST", body: { email: $("#ie", el).value, role: $("#ir", el).value, returnTo: location.origin + location.pathname } });
        await load(notice("ok", `Convite criado. Envie este link para <strong>${esc($("#ie", el)?.value || "")}</strong>:<div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><input class="field" id="ilink" readonly value="${esc(r.inviteUrl)}" style="flex:1;min-width:220px"><button class="btn sm" id="icopy">Copiar link</button></div>`));
        $("#icopy", el).onclick = async () => { try { await navigator.clipboard.writeText(r.inviteUrl); $("#icopy", el).textContent = "Copiado"; } catch { $("#ilink", el).select(); } };
      } catch (x) { msg("bad", esc(x.message)); busy(b, false); }
    };
    $$("[data-role]", el).forEach((sel) => sel.onchange = async () => { try { await api(`/team/members/${sel.dataset.role}`, { method: "PATCH", body: { role: sel.value } }); await load(); msg("ok", "Papel atualizado."); } catch (x) { msg("bad", esc(x.message)); await load(); } });
    $$("[data-rmm]", el).forEach((b) => b.onclick = async () => {
      if (!confirm(b.dataset.self ? "Sair deste workspace? Você perde o acesso às contas dele." : "Remover esta pessoa do workspace?")) return;
      try { await api(`/team/members/${b.dataset.rmm}`, { method: "DELETE" }); if (b.dataset.self) { localStorageSet(wsKey, null); me = null; $("#app").dataset.shell = ""; return go("/dashboard"); } await load(); } catch (x) { msg("bad", esc(x.message)); }
    });
    $$("[data-rmi]", el).forEach((b) => b.onclick = async () => { await api(`/team/invites/${b.dataset.rmi}`, { method: "DELETE" }); load(); });
  };
  await load();
};
